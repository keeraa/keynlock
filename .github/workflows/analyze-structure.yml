name: Analyze KEYNLOCK structure

on:
  push:
    paths:
      - .github/workflows/analyze-structure.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build architecture report
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('css/app.css').read_text(encoding='utf-8')
          js = Path('js/app.js').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')

          out=[]
          out.append('KEYNLOCK STRUCTURE REPORT')
          out.append(f'CSS lines={css.count(chr(10))+1} bytes={len(css.encode())}')
          out.append(f'JS lines={js.count(chr(10))+1} bytes={len(js.encode())}')
          out.append(f'HTML lines={html.count(chr(10))+1} bytes={len(html.encode())}')
          out.append('')
          out.append('=== REFERENCES ===')
          for term in ['LEGACY_PIN_SKINS','plate_05','lockpick-puzzle','LOCKPICK PUZZLE','SINGLE-FILE BUILD','ACTIVE_PLATE_SKIN_COUNT']:
              out.append(f'{term}: CSS={css.count(term)} JS={js.count(term)} HTML={html.count(term)}')
          out.append('')
          out.append('=== CSS TOP-LEVEL RULE STARTS ===')
          depth=0
          in_str=None
          esc=False
          in_comment=False
          pre=[]
          start_line=1
          line=1
          i=0
          while i < len(css):
              c=css[i]
              n=css[i+1] if i+1<len(css) else ''
              if c=='\n': line+=1
              if in_comment:
                  if c=='*' and n=='/': in_comment=False; i+=2; continue
                  i+=1; continue
              if not in_str and c=='/' and n=='*':
                  in_comment=True; i+=2; continue
              if in_str:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==in_str: in_str=None
                  if depth==0: pre.append(c)
                  i+=1; continue
              if c in ('\"',"'"):
                  in_str=c
                  if depth==0: pre.append(c)
                  i+=1; continue
              if depth==0:
                  if not pre and not c.isspace(): start_line=line
                  if c=='{':
                      selector=''.join(pre).strip().replace('\n',' ')
                      if selector:
                          out.append(f'{start_line}: {selector[:180]}')
                      pre=[]; depth=1
                  elif c==';':
                      pre=[]
                  else:
                      pre.append(c)
              else:
                  if c=='{': depth+=1
                  elif c=='}': depth-=1
              i+=1
          out.append('')
          out.append('=== JS TOP-LEVEL DECLARATIONS / SECTION COMMENTS ===')
          depth=0
          in_block=False
          for ln, raw in enumerate(js.splitlines(),1):
              s=raw.strip()
              if re.match(r'^(function\s+[A-Za-z_$][\w$]*\s*\(|(?:const|let|var)\s+[A-Za-z_$][\w$]*)', s):
                  out.append(f'{ln}: {s[:200]}')
              elif s.startswith('//') and ('===' in s or '---' in s or len(s) < 90):
                  out.append(f'{ln}: {s[:200]}')
              elif s.startswith('/*'):
                  out.append(f'{ln}: {s[:200]}')
          out.append('')
          out.append('=== SCRIPT/STYLE TAGS ===')
          for ln, raw in enumerate(html.splitlines(),1):
              if '<script' in raw or 'stylesheet' in raw or '<title>' in raw:
                  out.append(f'{ln}: {raw.strip()}')
          Path('ARCHITECTURE_REPORT.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit report and remove analyzer
        shell: bash
        run: |
          rm -f .github/workflows/analyze-structure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Analyze KEYNLOCK structure for v251"
          git push
