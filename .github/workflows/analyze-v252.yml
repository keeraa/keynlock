name: Analyze KEYNLOCK v252 JS

on:
  push:
    paths:
      - .github/workflows/analyze-v252.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze app.js
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('js/app.js')
          text=p.read_text(encoding='utf-8')
          lines=text.splitlines()
          out=[]
          out.append(f'lines={len(lines)} bytes={len(text.encode())} sha256={hashlib.sha256(text.encode()).hexdigest()}')
          out.append('\n=== SECTION / STANDALONE COMMENTS ===')
          for i,line in enumerate(lines,1):
              s=line.strip()
              if s.startswith('//') and (('=====' in s) or re.match(r'^// [A-ZА-Я][A-Za-zА-Яа-я /—+.-]{2,}$',s)):
                  out.append(f'{i}: {s}')
          out.append('\n=== TOP-LEVEL-LOOKING DECLARATIONS ===')
          for i,line in enumerate(lines,1):
              if re.match(r'^\s{0,2}(?:const|let|var|function)\s+[A-Za-z_$]',line):
                  out.append(f'{i}: {line.strip()[:180]}')
          out.append('\n=== LIKELY TOP-LEVEL CALLS / LISTENERS ===')
          patterns=[r'^\s{0,2}[A-Za-z_$][\w$]*\([^;]*\);\s*$',r'^\s{0,2}(?:window|document|body|\$[A-Za-z_$][\w$]*)\.[\w$]+\(']
          for i,line in enumerate(lines,1):
              if any(re.match(p,line) for p in patterns):
                  out.append(f'{i}: {line.strip()[:220]}')
          out.append('\n=== LAST 180 LINES ===')
          for i in range(max(1,len(lines)-179),len(lines)+1):
              out.append(f'{i}: {lines[i-1]}')
          Path('V252_JS_REPORT.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V252_JS_REPORT.txt
          git commit -m "Analyze JS boundaries for KEYNLOCK v252"
          git push
