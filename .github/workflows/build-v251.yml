name: Build KEYNLOCK v251

on:
  push:
    paths:
      - .github/workflows/build-v251.yml

permissions:
  contents: write

jobs:
  build-v251:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify v251
        shell: bash
        run: |
          set -o pipefail
          (
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, io, re, shutil

          css_path=Path('css/app.css')
          js_path=Path('js/app.js')
          html_path=Path('index.html')
          css=css_path.read_text(encoding='utf-8')
          js=js_path.read_text(encoding='utf-8')
          html=html_path.read_text(encoding='utf-8')

          # Three references were already broken in the manually uploaded v250 copy.
          # Point them to assets that are physically present; no gameplay values change.
          css=css.replace('../assets/locks/default-lock.webp','../assets/locks/level1/lock_00.png')
          css=css.replace('../assets/backgrounds/lair-overlay.jpg','../assets/lair/lair-background.jpg')
          css=css.replace('../assets/lair/lair-background.png','../assets/lair/lair-background.jpg')

          # Split CSS as four contiguous slices. Their concatenation is exactly the updated CSS.
          mode_i=css.find('.hillsfarMode')
          candidates=[]
          for needle in ('.inventoryDrawer','.worldMapScreen','.shopOverlay','.lairOverlay','.shopPanel'):
              i=css.find(needle,mode_i+1)
              if i!=-1: candidates.append(i)
          assert mode_i>0 and candidates
          world_i=min(candidates)
          motion_i=css.find(':root',world_i+1)
          assert mode_i < world_i < motion_i < len(css)
          parts=[
              ('css/base.css',css[:mode_i]),
              ('css/modes.css',css[mode_i:world_i]),
              ('css/world.css',css[world_i:motion_i]),
              ('css/motion.css',css[motion_i:]),
          ]
          assert ''.join(text for _,text in parts)==css
          for path,text in parts:
              Path(path).write_text(text,encoding='utf-8')
          css_path.unlink()

          # Proven dead declarations/assets.
          assert js.count('LEGACY_PIN_SKINS')==1
          start=js.index('const LEGACY_PIN_SKINS=')
          end=js.index('];',start)+2
          js=js[:start]+js[end:]
          old="'assets/plates/plate_04.webp',\n'assets/plates/plate_05.webp'"
          assert old in js and js.count('plate_05.webp')==1
          js=js.replace(old,"'assets/plates/plate_04.webp'",1)
          js_path.write_text(js,encoding='utf-8')
          Path('assets/plates/plate_05.webp').unlink(missing_ok=True)
          legacy=Path('assets/pins/legacy')
          if legacy.exists(): shutil.rmtree(legacy)

          # Brand entry point and preserve exact CSS load order; mobile remains last.
          html=re.sub(r'<!DOCTYPE html>\s*<!--.*?-->\s*','<!DOCTYPE html>\n<!-- KEYNLOCK — modular browser build -->\n',html,count=1,flags=re.S)
          html=re.sub(r'<title>.*?</title>','<title>KEYNLOCK — Lockpicking Puzzle</title>',html,count=1)
          old_link='<link rel="stylesheet" href="css/app.css">'
          links='\n'.join([
              '<link rel="stylesheet" href="css/base.css">',
              '<link rel="stylesheet" href="css/modes.css">',
              '<link rel="stylesheet" href="css/world.css">',
              '<link rel="stylesheet" href="css/motion.css">',
          ])
          assert old_link in html
          html=html.replace(old_link,links,1)
          html_path.write_text(html,encoding='utf-8')

          # Manifest now describes files that actually exist in the repository.
          manifest=Path('ASSET_MANIFEST.tsv')
          rows=list(csv.DictReader(io.StringIO(manifest.read_text(encoding='utf-8')),delimiter='\t'))
          rows=[r for r in rows if Path(r['path']).is_file()]
          out=io.StringIO(); fields=['index','mime','path','bytes','sha256_12']
          writer=csv.DictWriter(out,fieldnames=fields,delimiter='\t',lineterminator='\n')
          writer.writeheader()
          for i,r in enumerate(rows):
              r['index']=str(i); writer.writerow(r)
          manifest.write_text(out.getvalue(),encoding='utf-8')

          Path('VERSION').write_text('251\n',encoding='utf-8')
          Path('README.md').write_text('''# KEYNLOCK — v251\n\nBrowser lockpicking puzzle game. v251 preserves v250 gameplay while cleaning stale asset references and modularizing CSS without changing cascade order.\n\n- `index.html` — KEYNLOCK entry point\n- `css/base.css` — foundation, HUD and classic lock\n- `css/modes.css` — puzzle-mode styles\n- `css/world.css` — inventory, shop, map, lair and world UI\n- `css/motion.css` — final motion/compositor overrides\n- `css/mobile.css` — mobile overrides, loaded last\n- `js/app.js` — gameplay logic; only unused asset declarations removed in v251\n- `assets/` — active artwork\n\n`v250-stable` preserves the pre-v251 checkpoint.\n''',encoding='utf-8')

          # Runtime-reference verification.
          scan='\n'.join(Path(p).read_text(encoding='utf-8') for p in [
              'index.html','js/app.js','css/base.css','css/modes.css','css/world.css','css/motion.css','css/mobile.css'
          ])
          refs=sorted(set(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:png|webp|jpg|jpeg)',scan,re.I)))
          missing=[p for p in refs if not Path(p).is_file()]
          assert not missing, missing
          assert 'LEGACY_PIN_SKINS' not in scan
          assert 'plate_05.webp' not in scan
          assert 'SINGLE-FILE BUILD' not in scan
          assert 'LOCKPICK PUZZLE' not in scan
          print('CSS boundaries:',mode_i,world_i,motion_i)
          print('Runtime asset refs:',len(refs),'all present')
          print('Physical assets:',sum(1 for p in Path('assets').rglob('*') if p.is_file()))
          PY
          node --check js/app.js
          grep -q '^251$' VERSION
          test ! -e css/app.css
          echo 'KEYNLOCK v251 checks passed'
          ) 2>&1 | tee /tmp/v251-final.log

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          cp /tmp/v251-final.log V251_FAILURE.log 2>/dev/null || echo v251-failed > V251_FAILURE.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V251_FAILURE.log
          git commit -m "Record v251 build failure" || true
          git push || true

      - name: Commit v251
        if: success()
        shell: bash
        run: |
          rm -rf .github ARCHITECTURE_REPORT.txt V251_FAILURE.log RESTORE_ASSETS_FAILURE.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "KEYNLOCK v251: modular CSS and cleanup"
          git push
