name: Build KEYNLOCK v251

on:
  push:
    paths:
      - .github/workflows/build-v251.yml

permissions:
  contents: write

jobs:
  build-v251:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transform to v251
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, io, re

          css_path=Path('css/app.css')
          css=css_path.read_text(encoding='utf-8')
          js_path=Path('js/app.js')
          js=js_path.read_text(encoding='utf-8')
          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')

          # CSS: exact contiguous split preserving the original cascade byte-for-byte.
          mode_i=css.find('.hillsfarMode')
          world_candidates=[i for i in [
              css.find('.inventoryDrawer', mode_i+1),
              css.find('.worldMapScreen', mode_i+1),
              css.find('.shopOverlay', mode_i+1),
              css.find('.lairOverlay', mode_i+1),
              css.find('.shopPanel', mode_i+1),
          ] if i!=-1]
          assert mode_i>0 and world_candidates, (mode_i, world_candidates)
          world_i=min(world_candidates)
          motion_i=css.find(':root', world_i+1)
          assert mode_i < world_i < motion_i < len(css), (mode_i,world_i,motion_i,len(css))

          parts={
              'css/base.css': css[:mode_i],
              'css/modes.css': css[mode_i:world_i],
              'css/world.css': css[world_i:motion_i],
              'css/motion.css': css[motion_i:],
          }
          assert ''.join(parts.values())==css
          for path,text in parts.items():
              Path(path).write_text(text,encoding='utf-8')
          css_path.unlink()

          # JS tech-debt cleanup: remove the provably unused legacy pin pool.
          assert js.count('LEGACY_PIN_SKINS')==1
          start=js.index('const LEGACY_PIN_SKINS=')
          end=js.index('];',start)+2
          js=js[:start]+js[end:]

          # plate_05 is outside ACTIVE_PLATE_SKIN_COUNT=4 and has no other references.
          assert js.count('plate_05.webp')==1
          plate_line="'assets/plates/plate_05.webp'"
          pos=js.index(plate_line)
          before=js[:pos]
          after=js[pos+len(plate_line):]
          # It is the final array item, so remove its preceding comma and surrounding blank whitespace safely.
          m=re.search(r',\s*$',before)
          assert m
          before=before[:m.start()]+'\n'
          js=before+after.lstrip('\n')
          js_path.write_text(js,encoding='utf-8')

          # Remove now-unused physical assets.
          legacy_dir=Path('assets/pins/legacy')
          legacy_files=sorted(legacy_dir.glob('*'))
          assert len(legacy_files)==10, len(legacy_files)
          for p in legacy_files: p.unlink()
          legacy_dir.rmdir()
          plate5=Path('assets/plates/plate_05.webp')
          assert plate5.exists()
          plate5.unlink()

          # Keep manifest metadata, filter removed assets, and renumber indexes.
          manifest=Path('ASSET_MANIFEST.tsv')
          rows=list(csv.DictReader(io.StringIO(manifest.read_text(encoding='utf-8')),delimiter='\t'))
          rows=[r for r in rows if not r['path'].startswith('assets/pins/legacy/') and r['path']!='assets/plates/plate_05.webp']
          out=io.StringIO()
          writer=csv.DictWriter(out,fieldnames=['index','mime','path','bytes','sha256_12'],delimiter='\t',lineterminator='\n')
          writer.writeheader()
          for i,r in enumerate(rows):
              r['index']=str(i)
              writer.writerow(r)
          manifest.write_text(out.getvalue(),encoding='utf-8')

          # Branding + direct stylesheet loading in the exact former cascade order.
          html=re.sub(r'<!DOCTYPE html>\s*<!--.*?-->\s*', '<!DOCTYPE html>\n<!-- KEYNLOCK — modular browser build -->\n', html, count=1, flags=re.S)
          html=re.sub(r'<title>.*?</title>', '<title>KEYNLOCK — Lockpicking Puzzle</title>', html, count=1)
          old='<link rel="stylesheet" href="css/app.css">'
          new='\n'.join([
              '<link rel="stylesheet" href="css/base.css">',
              '<link rel="stylesheet" href="css/modes.css">',
              '<link rel="stylesheet" href="css/world.css">',
              '<link rel="stylesheet" href="css/motion.css">',
          ])
          assert old in html
          html=html.replace(old,new,1)
          html_path.write_text(html,encoding='utf-8')

          Path('VERSION').write_text('251\n',encoding='utf-8')
          Path('README.md').write_text('''# KEYNLOCK — v251\n\nBrowser lockpicking puzzle game. v251 keeps the v250 gameplay intact while cleaning dead assets and modularizing the stylesheet without changing cascade order.\n\n- `index.html` — markup and KEYNLOCK entry point\n- `css/base.css` — foundation, HUD and classic lock\n- `css/modes.css` — puzzle-mode styles\n- `css/world.css` — inventory, shop, map, lair and world UI\n- `css/motion.css` — final motion/compositor overrides\n- `css/mobile.css` — mobile overrides, loaded last\n- `js/app.js` — gameplay logic, unchanged except removal of unused asset constants\n- `assets/` — active game artwork\n\n`v250-stable` preserves the pre-cleanup baseline.\n''',encoding='utf-8')

          # Temporary analysis no longer belongs in the product tree.
          Path('ARCHITECTURE_REPORT.txt').unlink(missing_ok=True)
          PY

      - name: Verify v251
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          test ! -e css/app.css
          test -f css/base.css
          test -f css/modes.css
          test -f css/world.css
          test -f css/motion.css
          test -f css/mobile.css
          test ! -e assets/pins/legacy
          test ! -e assets/plates/plate_05.webp
          ! grep -R "LEGACY_PIN_SKINS\|plate_05.webp\|SINGLE-FILE BUILD\|LOCKPICK PUZZLE" index.html js css README.md
          grep -q '^251$' VERSION
          python3 - <<'PY'
          from pathlib import Path
          import re
          text='\n'.join(Path(p).read_text(encoding='utf-8') for p in ['index.html','js/app.js','css/base.css','css/modes.css','css/world.css','css/motion.css','css/mobile.css'])
          refs=sorted(set(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:png|webp|jpg|jpeg)',text,re.I)))
          missing=[p for p in refs if not Path(p).exists()]
          assert not missing, missing
          assert len(list(Path('assets').rglob('*.*')))==76
          PY

      - name: Commit v251 and remove builder
        shell: bash
        run: |
          rm -f .github/workflows/build-v251.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "KEYNLOCK v251: modular CSS and cleanup"
          git push
