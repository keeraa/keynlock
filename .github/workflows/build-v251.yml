name: Build KEYNLOCK v251

on:
  push:
    paths:
      - .github/workflows/build-v251.yml

permissions:
  contents: write

jobs:
  build-v251:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transform and verify v251
        shell: bash
        run: |
          set -o pipefail
          (
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, io, re

          print('1/8 read sources')
          css_path=Path('css/app.css')
          css=css_path.read_text(encoding='utf-8')
          js_path=Path('js/app.js')
          js=js_path.read_text(encoding='utf-8')
          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')

          print('2/8 split CSS')
          mode_i=css.find('.hillsfarMode')
          world_candidates=[]
          for needle in ('.inventoryDrawer','.worldMapScreen','.shopOverlay','.lairOverlay','.shopPanel'):
              i=css.find(needle,mode_i+1)
              if i!=-1: world_candidates.append((i,needle))
          assert mode_i>0 and world_candidates, (mode_i,world_candidates)
          world_i=min(world_candidates)[0]
          motion_i=css.find(':root',world_i+1)
          assert mode_i < world_i < motion_i < len(css), (mode_i,world_i,motion_i,len(css))
          parts=[
              ('css/base.css',css[:mode_i]),
              ('css/modes.css',css[mode_i:world_i]),
              ('css/world.css',css[world_i:motion_i]),
              ('css/motion.css',css[motion_i:]),
          ]
          assert ''.join(text for _,text in parts)==css
          for path,text in parts: Path(path).write_text(text,encoding='utf-8')
          css_path.unlink()
          print('CSS boundaries',mode_i,world_i,motion_i,'sizes',[len(x[1]) for x in parts])

          print('3/8 remove dead JS constants')
          assert js.count('LEGACY_PIN_SKINS')==1, js.count('LEGACY_PIN_SKINS')
          start=js.index('const LEGACY_PIN_SKINS=')
          end=js.index('];',start)+2
          js=js[:start]+js[end:]
          assert js.count('plate_05.webp')==1, js.count('plate_05.webp')
          old="'assets/plates/plate_04.webp',\n'assets/plates/plate_05.webp'"
          assert old in js
          js=js.replace(old,"'assets/plates/plate_04.webp'",1)
          js_path.write_text(js,encoding='utf-8')

          print('4/8 remove dead assets if present')
          legacy_dir=Path('assets/pins/legacy')
          if legacy_dir.exists():
              legacy_files=sorted(p for p in legacy_dir.iterdir() if p.is_file())
              for p in legacy_files: p.unlink()
              legacy_dir.rmdir()
              print('removed legacy files',len(legacy_files))
          else:
              print('legacy asset directory already absent')
          plate5=Path('assets/plates/plate_05.webp')
          if plate5.exists(): plate5.unlink()

          print('5/8 update manifest')
          manifest=Path('ASSET_MANIFEST.tsv')
          rows=list(csv.DictReader(io.StringIO(manifest.read_text(encoding='utf-8')),delimiter='\t'))
          old_count=len(rows)
          rows=[r for r in rows if not r['path'].startswith('assets/pins/legacy/') and r['path']!='assets/plates/plate_05.webp']
          assert old_count-len(rows)==11,(old_count,len(rows))
          out=io.StringIO()
          fields=['index','mime','path','bytes','sha256_12']
          writer=csv.DictWriter(out,fieldnames=fields,delimiter='\t',lineterminator='\n')
          writer.writeheader()
          for i,r in enumerate(rows):
              r['index']=str(i)
              writer.writerow(r)
          manifest.write_text(out.getvalue(),encoding='utf-8')

          print('6/8 brand KEYNLOCK and load CSS fragments')
          html=re.sub(r'<!DOCTYPE html>\s*<!--.*?-->\s*','<!DOCTYPE html>\n<!-- KEYNLOCK — modular browser build -->\n',html,count=1,flags=re.S)
          html=re.sub(r'<title>.*?</title>','<title>KEYNLOCK — Lockpicking Puzzle</title>',html,count=1)
          old_link='<link rel="stylesheet" href="css/app.css">'
          new_links='\n'.join([
              '<link rel="stylesheet" href="css/base.css">',
              '<link rel="stylesheet" href="css/modes.css">',
              '<link rel="stylesheet" href="css/world.css">',
              '<link rel="stylesheet" href="css/motion.css">',
          ])
          assert old_link in html
          html=html.replace(old_link,new_links,1)
          html_path.write_text(html,encoding='utf-8')

          print('7/8 docs')
          Path('VERSION').write_text('251\n',encoding='utf-8')
          Path('README.md').write_text('''# KEYNLOCK — v251\n\nBrowser puzzle game. v251 preserves v250 gameplay while removing unused visual assets and splitting the stylesheet without changing cascade order.\n\n- `index.html` — KEYNLOCK entry point\n- `css/base.css` — foundation, HUD and classic lock\n- `css/modes.css` — puzzle-mode styles\n- `css/world.css` — inventory, shop, map, lair and world UI\n- `css/motion.css` — final motion/compositor overrides\n- `css/mobile.css` — mobile overrides, loaded last\n- `js/app.js` — gameplay logic; only unused asset constants removed in v251\n- `assets/` — active artwork\n\n`v250-stable` preserves the pre-cleanup baseline.\n''',encoding='utf-8')
          Path('ARCHITECTURE_REPORT.txt').unlink(missing_ok=True)

          print('8/8 verify references')
          scan='\n'.join(Path(p).read_text(encoding='utf-8') for p in ['index.html','js/app.js','css/base.css','css/modes.css','css/world.css','css/motion.css','css/mobile.css'])
          assert 'LEGACY_PIN_SKINS' not in scan
          assert 'plate_05.webp' not in scan
          assert 'SINGLE-FILE BUILD' not in scan
          assert 'LOCKPICK PUZZLE' not in scan
          refs=sorted(set(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:png|webp|jpg|jpeg)',scan,re.I)))
          missing=[p for p in refs if not Path(p).exists()]
          assert not missing,missing
          asset_count=sum(1 for p in Path('assets').rglob('*') if p.is_file())
          assert asset_count==len(rows)==76,(asset_count,len(rows))
          print('v251 checks OK; assets',asset_count,'refs',len(refs))
          PY
          node --check js/app.js
          test ! -e css/app.css
          grep -q '^251$' VERSION
          echo 'v251 all checks OK'
          ) 2>&1 | tee /tmp/v251.log

      - name: Commit failure diagnostic
        if: failure()
        shell: bash
        run: |
          cp /tmp/v251.log V251_FAILURE.log 2>/dev/null || echo 'v251 failed before log capture' > V251_FAILURE.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V251_FAILURE.log
          git commit -m "Record v251 build failure" || true
          git push || true

      - name: Commit v251
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/build-v251.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rm -f V251_FAILURE.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "KEYNLOCK v251: modular CSS and cleanup"
          git push
