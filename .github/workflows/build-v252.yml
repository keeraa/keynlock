name: Build KEYNLOCK v252

on:
  push:
    paths:
      - .github/workflows/build-v252.yml

permissions:
  contents: write

jobs:
  build-v252:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split app.js mechanically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          src=Path('js/app.js')
          text=src.read_text(encoding='utf-8')
          original_sha=hashlib.sha256(text.encode()).hexdigest()
          assert text.startswith('(() => {\n')
          tail_marker='/* Inventory visual hit testing */'
          tail_i=text.index(tail_marker)
          main=text[:tail_i]
          tail=text[tail_i:]
          close_i=main.rfind('\n})();')
          assert close_i>0
          inner=main[len('(() => {\n'):close_i]

          def pos(marker, start=0):
              i=inner.find(marker,start)
              assert i>=0, marker
              return i

          markers=[
            ('js/core/audio.js','  let audioCtx=null;'),
            ('js/core/ui.js','  function shuffle'),
            ('js/world/inventory.js','  function inventoryEls'),
            ('js/world/lair.js','  function saveLairIntel'),
            ('js/world/navigation-shop.js','  function renderWorldMap'),
            ('js/core/digital-helpers.js','  // Digital puzzle helpers'),
            ('js/modes/heat-cold.js','  // Heat / cold'),
            ('js/modes/drum.js','  // Drum clicks'),
            ('js/modes/oscilloscope.js','  // Oscilloscope'),
            ('js/core/game.js','  function updateModeUI'),
            ('js/modes/mass-effect.js','  // ===== MASS EFFECT ====='),
            ('js/modes/anachronox.js','  // ===== ANACHRONOX ====='),
            ('js/modes/composite.js','  // ===== COMPOSITE PICK — CONTINUOUS BUILDER ====='),
            ('js/modes/tension.js','  // ===== TENSION CONTROL ====='),
            ('js/modes/resonance.js','  // ===== RESONANCE ====='),
            ('js/modes/deduction.js','  // ===== KEY DEDUCTION ====='),
            ('js/modes/skyrim.js','  // ===== SKYRIM ====='),
            ('js/modes/risen2.js','  // ===== RISEN 2 ====='),
            ('js/modes/gothic1.js','  // ===== GOTHIC 1 ====='),
            ('js/modes/hillsfar.js','  // ===== HILLSFAR ====='),
            ('js/modes/base-locks.js','  // ===== BASE / SPECIAL LOCKS ====='),
          ]

          tabler_i=pos('  function tablerIcon')
          init_i=inner.rfind('  requestAnimationFrame(animationLoop);',0,tabler_i)
          assert init_i>0
          markers.append(('js/core/init.js',inner[init_i:tabler_i]+'  function tablerIcon'))

          cuts=[]
          last=-1
          for path,marker in markers:
              i=pos(marker,max(0,last)) if path!='js/core/init.js' else init_i
              assert i>last,(path,i,last)
              cuts.append((path,i))
              last=i

          parts=[]
          first_path='js/core/state.js'
          boundaries=[(first_path,0)]+cuts
          for idx,(path,start) in enumerate(boundaries):
              end=boundaries[idx+1][1] if idx+1<len(boundaries) else len(inner)
              chunk=inner[start:end]
              assert chunk.strip(),path
              Path(path).parent.mkdir(parents=True,exist_ok=True)
              Path(path).write_text(chunk,encoding='utf-8')
              parts.append(path)

          tail_path='js/core/inventory-hit-testing.js'
          Path(tail_path).write_text(tail,encoding='utf-8')

          joined=''.join(Path(p).read_text(encoding='utf-8') for p in parts)
          assert joined==inner
          assert Path(tail_path).read_text(encoding='utf-8')==tail

          src.unlink()

          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')
          old='<script src="js/app.js"></script>'
          assert html.count(old)==1
          ordered=parts+[tail_path]
          scripts='\n'.join(f'<script src="{p}"></script>' for p in ordered)
          html=html.replace(old,scripts,1)
          html_path.write_text(html,encoding='utf-8')

          Path('VERSION').write_text('252\n',encoding='utf-8')
          Path('js/README.md').write_text('''# KEYNLOCK JavaScript architecture\n\nv252 mechanically splits the former `app.js`. Scripts are classic browser scripts and their order in `index.html` is significant.\n\n- `core/state.js` — persistent state, DOM references, mode registry and visual assets\n- `core/audio.js` — audio engine and SFX\n- `core/ui.js` — economy, pick skins and common UI helpers\n- `world/` — inventory, lair, map/navigation and shop\n- `core/digital-helpers.js` — helpers shared by digital puzzles\n- `modes/` — individual imported mechanics; `base-locks.js` serves Classic, Target, Another Line, Alternative 2 and Special locks\n- `core/game.js` — mode UI, solve flow and shared puzzle generation\n- `core/init.js` — animation startup, input bindings and application initialization\n- `core/inventory-hit-testing.js` — isolated expanded inventory hit testing\n\nThe outer v251 IIFE was removed so the mechanically split classic scripts share the same global lexical environment. No function body or gameplay expression is intentionally rewritten in v252.\n''',encoding='utf-8')
          Path('README.md').write_text('''# KEYNLOCK — v252\n\nBrowser lockpicking puzzle game. v252 keeps the v251 gameplay and visual values while modularizing JavaScript.\n\n- `index.html` — KEYNLOCK entry point and ordered stylesheet/script loading\n- `css/` — modular CSS from v251\n- `js/core/` — shared state, UI, audio, game flow, input/init\n- `js/world/` — inventory, lair, map/navigation and shop\n- `js/modes/` — puzzle mechanics\n- `assets/` — active artwork\n\nStable checkpoints: `v250-stable`, `v251-stable`.\n''',encoding='utf-8')

          Path('/tmp/v252_meta.txt').write_text('\n'.join([
              f'original_sha256={original_sha}',
              f'main_inner_bytes={len(inner.encode())}',
              f'files={len(parts)+1}',
              *[f'{p}\t{Path(p).stat().st_size}' for p in parts+[tail_path]],
          ])+'\n',encoding='utf-8')
          PY

          test ! -e js/app.js
          test "$(cat VERSION)" = 252
          ! grep -R 'js/app.js' index.html README.md js/README.md
          for f in $(find js -type f -name '*.js' | sort); do node --check "$f"; done
          cat /tmp/v252_meta.txt

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/keynlock-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          mkdir -p /tmp/keynlock-pw
          cd /tmp/keynlock-pw
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          cd "$GITHUB_WORKSPACE"
          CHROME_BIN="$CHROME_BIN" NODE_PATH=/tmp/keynlock-pw/node_modules node <<'NODE'
          const {chromium}=require('playwright-core');
          const assert=(v,m)=>{if(!v) throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const errors=[];
            const testPage=async(viewport,mobile=false)=>{
              const page=await browser.newPage({viewport});
              page.on('pageerror',e=>errors.push('pageerror: '+e.message));
              page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
              const response=await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
              assert(response && response.ok(),'HTTP load failed');
              assert((await page.title()).includes('KEYNLOCK'),'title is not KEYNLOCK');
              await page.waitForTimeout(250);
              const ids=['tabClassic','tabTarget','tabLine','tabAlt2','tabSpecial','tabHillsfar','tabMass','tabG1','tabR2','tabSkyrim','tabAnach','tabTension','tabResonance','tabDeduction','tabComposite','tabHeatCold','tabDrum','tabScope'];
              for(const id of ids){
                const el=page.locator('#'+id);
                assert(await el.count()===1,'missing '+id);
                await el.click({force:true});
                await page.waitForTimeout(45);
              }
              if(mobile){
                await page.locator('#mobileModeMenuButton').click({force:true});
                await page.waitForTimeout(60);
                assert(await page.locator('body.mobile-mode-menu-open').count()===1,'mobile mode menu did not open');
                await page.locator('#tabMass').click({force:true});
              } else {
                await page.locator('#mapTab').click({force:true});
                await page.waitForTimeout(80);
                assert(await page.locator('#worldMapScreen:not([hidden])').count()===1,'map did not open');
                await page.locator('#worldMapClose').click({force:true});
                await page.locator('#lairHudButton').click({force:true});
                await page.waitForTimeout(80);
                assert(await page.locator('#lairOverlay:not([hidden])').count()===1,'lair did not open');
                await page.locator('#lairClose').click({force:true});
                await page.waitForTimeout(80);
                if(await page.locator('#worldMapScreen:not([hidden])').count()) await page.locator('#worldMapClose').click({force:true});
                await page.locator('#shopHudButton').click({force:true});
                await page.waitForTimeout(80);
                assert(await page.locator('#shopOverlay.open').count()===1,'shop did not open');
                await page.locator('#shopClose').click({force:true});
              }
              await page.close();
            };
            await testPage({width:1440,height:900},false);
            await testPage({width:390,height:844},true);
            await browser.close();
            if(errors.length) throw new Error(errors.join('\n'));
            console.log('KEYNLOCK v252 browser smoke test: OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit v252
        shell: bash
        run: |
          set -euo pipefail
          rm -f V252_JS_REPORT.txt
          rm -f .github/workflows/analyze-v252.yml
          rm -f .github/workflows/build-v252.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "KEYNLOCK v252: modular JavaScript"
          git push
