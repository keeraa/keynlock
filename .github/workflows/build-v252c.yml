name: Build KEYNLOCK v252 final

on:
  push:
    paths:
      - .github/workflows/build-v252c.yml

permissions:
  contents: write

jobs:
  build-v252:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize CSS asset URLs and split JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          src=Path('js/app.js')
          text=src.read_text(encoding='utf-8')
          before_sha=hashlib.sha256(text.encode()).hexdigest()
          assert text.startswith('(() => {\n')
          assert 'function cssUrl(' not in text

          anchor='  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}\n'
          helper='  function cssUrl(uri){ return `url("${new URL(uri, document.baseURI).href}")`; }\n'
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+'\n'+helper,1)

          replacements=[
            ('const lockBody=`url(\\"${currentLockBodySkin()}\\")`;','const lockBody=cssUrl(currentLockBodySkin());'),
            ('const locker=`url(\\"${currentLockerSkin()}\\")`;','const locker=cssUrl(currentLockerSkin());'),
            ('document.documentElement.style.setProperty(\'--pick-skin-image\',`url(\\"${uri}\\")`);','document.documentElement.style.setProperty(\'--pick-skin-image\',cssUrl(uri));'),
            ('document.documentElement.style.setProperty(\'--tension-skin-image\',`url(\\"${uri}\\")`);','document.documentElement.style.setProperty(\'--tension-skin-image\',cssUrl(uri));'),
            ('const pinImage=`url(\\"${pinSkin}\\")`;','const pinImage=cssUrl(pinSkin);'),
            ('const plateImage=`url(\\"${plateSkin}\\")`;','const plateImage=cssUrl(plateSkin);'),
          ]
          for old,new in replacements:
              c=text.count(old)
              assert c==1,(old,c)
              text=text.replace(old,new,1)
          leftovers=[(i,l.strip()) for i,l in enumerate(text.splitlines(),1) if '`url(' in l and '${' in l]
          assert not leftovers,leftovers

          tail_marker='/* Inventory visual hit testing */'
          tail_i=text.index(tail_marker)
          main=text[:tail_i]
          tail=text[tail_i:]
          close_i=main.rfind('\n})();')
          assert close_i>0
          inner=main[len('(() => {\n'):close_i]
          markers=[
            ('js/core/audio.js','  let audioCtx=null;'),
            ('js/core/ui.js','  function shuffle'),
            ('js/world/inventory.js','  function inventoryEls'),
            ('js/world/lair.js','  function saveLairIntel'),
            ('js/world/navigation-shop.js','  function renderWorldMap'),
            ('js/core/digital-helpers.js','  // Digital puzzle helpers'),
            ('js/modes/heat-cold.js','  // Heat / cold'),
            ('js/modes/drum.js','  // Drum clicks'),
            ('js/modes/oscilloscope.js','  // Oscilloscope'),
            ('js/core/game.js','  function updateModeUI'),
            ('js/modes/mass-effect.js','  // ===== MASS EFFECT ====='),
            ('js/modes/anachronox.js','  // ===== ANACHRONOX ====='),
            ('js/modes/composite.js','  // ===== COMPOSITE PICK — CONTINUOUS BUILDER ====='),
            ('js/modes/tension.js','  // ===== TENSION CONTROL ====='),
            ('js/modes/resonance.js','  // ===== RESONANCE ====='),
            ('js/modes/deduction.js','  // ===== KEY DEDUCTION ====='),
            ('js/modes/skyrim.js','  // ===== SKYRIM ====='),
            ('js/modes/risen2.js','  // ===== RISEN 2 ====='),
            ('js/modes/gothic1.js','  // ===== GOTHIC 1 ====='),
            ('js/modes/hillsfar.js','  // ===== HILLSFAR ====='),
            ('js/modes/base-locks.js','  // ===== BASE / SPECIAL LOCKS ====='),
          ]
          cuts=[]; last=-1
          for path,marker in markers:
              i=inner.find(marker,last+1)
              assert i>last,(path,i,last)
              cuts.append((path,i)); last=i
          tabler_i=inner.find('  function tablerIcon',last+1)
          init_i=inner.rfind('  requestAnimationFrame(animationLoop);',0,tabler_i)
          assert init_i>last
          cuts.append(('js/core/init.js',init_i))
          bounds=[('js/core/state.js',0)]+cuts
          parts=[]
          for n,(path,start) in enumerate(bounds):
              end=bounds[n+1][1] if n+1<len(bounds) else len(inner)
              Path(path).parent.mkdir(parents=True,exist_ok=True)
              Path(path).write_text(inner[start:end],encoding='utf-8')
              parts.append(path)
          tail_path='js/core/inventory-hit-testing.js'
          Path(tail_path).write_text(tail,encoding='utf-8')
          assert ''.join(Path(p).read_text(encoding='utf-8') for p in parts)==inner
          assert Path(tail_path).read_text(encoding='utf-8')==tail
          src.unlink()

          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')
          old='<script src="js/app.js"></script>'
          assert html.count(old)==1
          ordered=parts+[tail_path]
          html=html.replace(old,'\n'.join(f'<script src="{p}"></script>' for p in ordered),1)
          html_path.write_text(html,encoding='utf-8')
          Path('VERSION').write_text('252\n',encoding='utf-8')
          Path('js/README.md').write_text('''# KEYNLOCK JavaScript architecture\n\nv252 splits the former `app.js` into ordered classic scripts.\n\n- `core/state.js` — state, DOM references, mode registry and visual assets\n- `core/audio.js` — audio and SFX\n- `core/ui.js` — economy, skins and common UI\n- `world/` — inventory, lair, map/navigation and shop\n- `core/digital-helpers.js` — shared digital-puzzle helpers\n- `modes/` — individual mechanics; `base-locks.js` serves Classic, Target, Another Line, Alternative 2 and Special locks\n- `core/game.js` — shared solve flow and puzzle generation\n- `core/init.js` — animation startup, input bindings and initialization\n- `core/inventory-hit-testing.js` — expanded inventory hit testing\n\nThe only intentional runtime change is `cssUrl(uri)`, which resolves images passed through CSS variables relative to the document. This prevents `/css/assets/...` requests after the stylesheet split. Script order in `index.html` is significant.\n''',encoding='utf-8')
          Path('README.md').write_text('''# KEYNLOCK — v252\n\nBrowser lockpicking puzzle game. v252 modularizes JavaScript and fixes asset URLs used through CSS variables.\n\n- `index.html` — KEYNLOCK entry point\n- `css/` — modular CSS\n- `js/core/` — shared runtime\n- `js/world/` — inventory, lair, map/navigation and shop\n- `js/modes/` — puzzle mechanics\n- `assets/` — active artwork\n\nStable checkpoints: `v250-stable`, `v251-stable`.\n''',encoding='utf-8')
          print('v251_sha256',before_sha,'split_main_parts',len(parts),'total_js',len(parts)+1,'url_fixes',len(replacements))
          PY
          for f in $(find js -type f -name '*.js' | sort); do node --check "$f"; done
          test ! -e js/app.js
          test "$(cat VERSION)" = 252

      - name: Interactive Chrome smoke test
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/v252-browser.log) 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/keynlock-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          mkdir -p /tmp/keynlock-pw
          cd /tmp/keynlock-pw
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          cd "$GITHUB_WORKSPACE"
          CHROME_BIN="$CHROME_BIN" NODE_PATH=/tmp/keynlock-pw/node_modules node <<'NODE'
          const {chromium}=require('playwright-core');
          const assert=(v,m)=>{if(!v) throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const errors=[];
            async function exercise(viewport,mobile){
              const page=await browser.newPage({viewport});
              page.on('pageerror',e=>errors.push('pageerror: '+e.message));
              page.on('console',m=>{if(m.type()==='error' && !m.text().includes('Failed to load resource')) errors.push('console: '+m.text());});
              page.on('response',r=>{const u=r.url(); if(r.status()>=400 && u.startsWith('http://127.0.0.1:8765/') && !u.endsWith('/favicon.ico')) errors.push(`HTTP ${r.status()} ${u}`);});
              const response=await page.goto('http://127.0.0.1:8765/',{waitUntil:'load',timeout:15000});
              assert(response?.ok(),'root HTTP load failed');
              assert((await page.title()).includes('KEYNLOCK'),'wrong title');
              await page.waitForTimeout(400);
              const ids=['tabClassic','tabTarget','tabLine','tabAlt2','tabSpecial','tabHillsfar','tabMass','tabG1','tabR2','tabSkyrim','tabAnach','tabTension','tabResonance','tabDeduction','tabComposite','tabHeatCold','tabDrum','tabScope'];
              for(const id of ids){const el=page.locator('#'+id); assert(await el.count()===1,'missing '+id); await el.click({force:true}); await page.waitForTimeout(55);}
              if(mobile){
                const menu=page.locator('#mobileModeMenuButton'); assert(await menu.count()===1,'missing mobile menu'); await menu.click({force:true}); await page.waitForTimeout(80); assert(await page.locator('body.mobile-mode-menu-open').count()===1,'mobile menu did not open'); await page.locator('#tabMass').click({force:true});
              } else {
                await page.locator('#mapTab').click({force:true}); await page.waitForTimeout(100); assert(await page.locator('#worldMapScreen:not([hidden])').count()===1,'map did not open'); await page.locator('#worldMapClose').click({force:true});
                await page.locator('#lairHudButton').click({force:true}); await page.waitForTimeout(100); assert(await page.locator('#lairOverlay:not([hidden])').count()===1,'lair did not open'); await page.locator('#lairClose').click({force:true}); await page.waitForTimeout(100); if(await page.locator('#worldMapScreen:not([hidden])').count()) await page.locator('#worldMapClose').click({force:true});
                await page.locator('#shopHudButton').click({force:true}); await page.waitForTimeout(100); assert(await page.locator('#shopOverlay.open').count()===1,'shop did not open'); await page.locator('#shopClose').click({force:true});
              }
              await page.waitForTimeout(200);
              await page.close();
            }
            await exercise({width:1440,height:900},false);
            await exercise({width:390,height:844},true);
            await browser.close();
            if(errors.length) throw new Error(errors.join('\n'));
            console.log('KEYNLOCK v252 interactive smoke: OK');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          if grep -E '"GET /css/assets/|"GET /assets/.* HTTP/1.1" 404' /tmp/keynlock-http.log; then
            echo 'Unexpected asset 404 detected'; exit 1
          fi

      - name: Capture failure
        if: failure()
        shell: bash
        run: |
          set +e
          { echo 'KEYNLOCK v252 final build failed'; echo '--- browser log ---'; cat /tmp/v252-browser.log 2>/dev/null; echo '--- http log ---'; cat /tmp/keynlock-http.log 2>/dev/null; } >/tmp/V252_FAILURE_FINAL.log 2>&1
          git reset --hard HEAD
          cp /tmp/V252_FAILURE_FINAL.log V252_FAILURE_FINAL.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V252_FAILURE_FINAL.log
          git commit -m "Record v252 final build failure" || true
          git push || true

      - name: Commit v252
        shell: bash
        run: |
          set -euo pipefail
          rm -f V252_JS_REPORT.txt V252_DIAGNOSTIC.txt V252_FAILURE.log V252_FAILURE_FINAL.log RESTORE_ASSETS_FAILURE.log
          rm -f .github/workflows/analyze-v252.yml .github/workflows/build-v252.yml .github/workflows/build-v252b.yml .github/workflows/build-v252c.yml .github/workflows/diagnose-v252.yml .github/workflows/restore-assets.yml .github/workflows/resume-v251.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "KEYNLOCK v252: modular JavaScript"
          git push
