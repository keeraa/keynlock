name: Build KEYNLOCK v252 final

on:
  push:
    paths:
      - .github/workflows/build-v252c.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transform v251 to v252
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          src=Path('js/app.js')
          text=src.read_text(encoding='utf-8')
          source_sha=hashlib.sha256(text.encode()).hexdigest()
          assert text.startswith('(() => {\n')

          # Resolve URLs injected into CSS variables relative to index.html,
          # not relative to whichever stylesheet consumes the variable.
          anchor='  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}\n'
          assert text.count(anchor)==1
          helper='  function cssUrl(uri){ return `url("${new URL(uri, document.baseURI).href}")`; }\n'
          text=text.replace(anchor,anchor+'\n'+helper,1)
          q=chr(34)
          fixes=[
            ('`url('+q+'${currentLockBodySkin()}'+q+')`','cssUrl(currentLockBodySkin())',1),
            ('`url('+q+'${currentLockerSkin()}'+q+')`','cssUrl(currentLockerSkin())',1),
            ('`url('+q+'${uri}'+q+')`','cssUrl(uri)',2),
            ('`url('+q+'${pinSkin}'+q+')`','cssUrl(pinSkin)',1),
            ('`url('+q+'${plateSkin}'+q+')`','cssUrl(plateSkin)',1),
          ]
          for old,new,expected in fixes:
              found=text.count(old)
              assert found==expected,(old,found,expected)
              text=text.replace(old,new,expected)

          tail_marker='/* Inventory visual hit testing */'
          tail_i=text.index(tail_marker)
          main=text[:tail_i]
          tail=text[tail_i:]
          close_i=main.rfind('\n})();')
          assert close_i>0
          inner=main[len('(() => {\n'):close_i]

          markers=[
            ('js/core/audio.js','  let audioCtx=null;'),
            ('js/core/ui.js','  function shuffle'),
            ('js/world/inventory.js','  function inventoryEls'),
            ('js/world/lair.js','  function saveLairIntel'),
            ('js/world/navigation-shop.js','  function renderWorldMap'),
            ('js/core/digital-helpers.js','  // Digital puzzle helpers'),
            ('js/modes/heat-cold.js','  // Heat / cold'),
            ('js/modes/drum.js','  // Drum clicks'),
            ('js/modes/oscilloscope.js','  // Oscilloscope'),
            ('js/core/game.js','  function updateModeUI'),
            ('js/modes/mass-effect.js','  // ===== MASS EFFECT ====='),
            ('js/modes/anachronox.js','  // ===== ANACHRONOX ====='),
            ('js/modes/composite.js','  // ===== COMPOSITE PICK — CONTINUOUS BUILDER ====='),
            ('js/modes/tension.js','  // ===== TENSION CONTROL ====='),
            ('js/modes/resonance.js','  // ===== RESONANCE ====='),
            ('js/modes/deduction.js','  // ===== KEY DEDUCTION ====='),
            ('js/modes/skyrim.js','  // ===== SKYRIM ====='),
            ('js/modes/risen2.js','  // ===== RISEN 2 ====='),
            ('js/modes/gothic1.js','  // ===== GOTHIC 1 ====='),
            ('js/modes/hillsfar.js','  // ===== HILLSFAR ====='),
            ('js/modes/base-locks.js','  // ===== BASE / SPECIAL LOCKS ====='),
          ]
          cuts=[]
          last=-1
          for path,marker in markers:
              i=inner.find(marker,last+1)
              assert i>last,(path,i,last)
              cuts.append((path,i))
              last=i
          tabler=inner.find('  function tablerIcon',last+1)
          init=inner.rfind('  requestAnimationFrame(animationLoop);',0,tabler)
          assert init>last
          cuts.append(('js/core/init.js',init))

          bounds=[('js/core/state.js',0)]+cuts
          parts=[]
          for n,(path,start) in enumerate(bounds):
              end=bounds[n+1][1] if n+1<len(bounds) else len(inner)
              chunk=inner[start:end]
              assert chunk.strip(),path
              p=Path(path)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(chunk,encoding='utf-8')
              parts.append(path)
          tail_path='js/core/inventory-hit-testing.js'
          Path(tail_path).write_text(tail,encoding='utf-8')
          assert ''.join(Path(p).read_text(encoding='utf-8') for p in parts)==inner
          assert Path(tail_path).read_text(encoding='utf-8')==tail
          src.unlink()

          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')
          old='<script src="js/app.js"></script>'
          assert html.count(old)==1
          ordered=parts+[tail_path]
          html=html.replace(old,'\n'.join(f'<script src="{p}"></script>' for p in ordered),1)
          html_path.write_text(html,encoding='utf-8')

          Path('VERSION').write_text('252\n',encoding='utf-8')
          Path('js/README.md').write_text('''# KEYNLOCK JavaScript architecture\n\nv252 splits the former `app.js` into ordered classic scripts. Script order in `index.html` is significant.\n\n- `core/state.js` — state, DOM references, mode registry and visual assets\n- `core/audio.js` — audio and SFX\n- `core/ui.js` — economy, skins and common UI\n- `world/` — inventory, lair, map/navigation and shop\n- `core/digital-helpers.js` — shared digital-puzzle helpers\n- `modes/` — individual mechanics; `base-locks.js` serves Classic, Target, Another Line, Alternative 2 and Special locks\n- `core/game.js` — shared solve flow and puzzle generation\n- `core/init.js` — animation startup, input bindings and initialization\n- `core/inventory-hit-testing.js` — expanded inventory hit testing\n\nThe outer v251 IIFE is removed so these classic scripts share one global lexical environment. The only intentional runtime fix is `cssUrl(uri)`, which resolves assets passed through CSS variables against the document.\n''',encoding='utf-8')
          Path('README.md').write_text('''# KEYNLOCK — v252\n\nBrowser lockpicking puzzle game. v252 modularizes JavaScript and fixes asset URLs passed through CSS variables.\n\n- `index.html` — KEYNLOCK entry point\n- `css/` — modular CSS\n- `js/core/` — shared runtime\n- `js/world/` — inventory, lair, map/navigation and shop\n- `js/modes/` — puzzle mechanics\n- `assets/` — active artwork\n\nStable checkpoints: `v250-stable`, `v251-stable`.\n''',encoding='utf-8')
          print('source',source_sha,'main_parts',len(parts),'all_js',len(parts)+1,'css_url_fixes',sum(x[2] for x in fixes))
          PY

          test ! -e js/app.js
          test "$(cat VERSION)" = 252
          for f in $(find js -type f -name '*.js' | sort); do node --check "$f"; done

      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/v252-browser.log) 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/keynlock-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          mkdir -p /tmp/keynlock-pw
          cd /tmp/keynlock-pw
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          cd "$GITHUB_WORKSPACE"
          CHROME_BIN="$CHROME_BIN" NODE_PATH=/tmp/keynlock-pw/node_modules node <<'NODE'
          const {chromium}=require('playwright-core');
          const assert=(v,m)=>{if(!v) throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const errors=[];
            async function run(viewport,mobile){
              const page=await browser.newPage({viewport});
              page.on('pageerror',e=>errors.push('pageerror: '+e.message));
              page.on('response',r=>{
                const u=r.url();
                if(r.status()>=400 && u.startsWith('http://127.0.0.1:8765/') && !u.endsWith('/favicon.ico')) errors.push(`HTTP ${r.status()} ${u}`);
              });
              const response=await page.goto('http://127.0.0.1:8765/',{waitUntil:'load',timeout:15000});
              assert(response?.ok(),'root failed');
              assert((await page.title()).includes('KEYNLOCK'),'wrong title');
              await page.waitForTimeout(400);
              const ids=['tabClassic','tabTarget','tabLine','tabAlt2','tabSpecial','tabHillsfar','tabMass','tabG1','tabR2','tabSkyrim','tabAnach','tabTension','tabResonance','tabDeduction','tabComposite','tabHeatCold','tabDrum','tabScope'];
              for(const id of ids){await page.locator('#'+id).click({force:true});await page.waitForTimeout(45);}
              if(mobile){
                await page.locator('#mobileModeMenuButton').click({force:true});
                await page.waitForTimeout(70);
                assert(await page.locator('body.mobile-mode-menu-open').count()===1,'mobile menu failed');
                await page.locator('#tabMass').click({force:true});
              }else{
                await page.locator('#mapTab').click({force:true});await page.waitForTimeout(80);assert(await page.locator('#worldMapScreen:not([hidden])').count()===1,'map failed');await page.locator('#worldMapClose').click({force:true});
                await page.locator('#lairHudButton').click({force:true});await page.waitForTimeout(80);assert(await page.locator('#lairOverlay:not([hidden])').count()===1,'lair failed');await page.locator('#lairClose').click({force:true});await page.waitForTimeout(80);if(await page.locator('#worldMapScreen:not([hidden])').count())await page.locator('#worldMapClose').click({force:true});
                await page.locator('#shopHudButton').click({force:true});await page.waitForTimeout(80);assert(await page.locator('#shopOverlay.open').count()===1,'shop failed');await page.locator('#shopClose').click({force:true});
              }
              await page.waitForTimeout(150);
              await page.close();
            }
            await run({width:1440,height:900},false);
            await run({width:390,height:844},true);
            await browser.close();
            if(errors.length) throw new Error(errors.join('\n'));
            console.log('KEYNLOCK v252 smoke OK');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          if grep -q '"GET /css/assets/' /tmp/keynlock-http.log; then echo 'css/assets path regression'; grep '"GET /css/assets/' /tmp/keynlock-http.log; exit 1; fi

      - name: Capture failure
        if: failure()
        shell: bash
        run: |
          set +e
          { echo 'v252 failed'; echo '--- browser ---'; cat /tmp/v252-browser.log 2>/dev/null; echo '--- http tail ---'; tail -150 /tmp/keynlock-http.log 2>/dev/null; } >/tmp/V252_FAILURE_LAST.log
          git reset --hard HEAD
          cp /tmp/V252_FAILURE_LAST.log V252_FAILURE_LAST.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V252_FAILURE_LAST.log
          git commit -m "Record v252 build diagnostic" || true
          git push || true

      - name: Commit v252
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github
          rm -f V252_JS_REPORT.txt V252_DIAGNOSTIC.txt V252_FAILURE.log V252_FAILURE_FINAL.log V252_FAILURE_LAST.log V252_PATTERN_REPORT.txt RESTORE_ASSETS_FAILURE.log ARCHITECTURE_REPORT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "KEYNLOCK v252: modular JavaScript"
          git push
