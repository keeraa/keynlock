name: Build KEYNLOCK v254 final

on:
  push:
    paths:
      - .github/workflows/build-v254-final.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transform CSS architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          assert Path('VERSION').read_text().strip() == '253'

          def write_chunks(source,prefix,markers):
              text=Path(source).read_text(encoding='utf-8')
              found=[]
              for label,marker in markers:
                  i=text.find(marker)
                  assert i>=0,(source,label,marker)
                  found.append((i,label))
              found.sort()
              assert found[0][0]==0,(source,found[0])
              paths=[]; pieces=[]
              for n,(start,label) in enumerate(found):
                  end=found[n+1][0] if n+1<len(found) else len(text)
                  piece=text[start:end]
                  path=Path('css')/f'{prefix}-{n+1:02d}-{label}.css'
                  path.write_text(piece,encoding='utf-8')
                  paths.append(path.as_posix()); pieces.append(piece)
              assert ''.join(pieces)==text
              Path(source).unlink()
              return paths

          modes=write_chunks('css/modes.css','modes',[
              ('hillsfar','.hillsfarMode{'),
              ('mass-effect','.massMode{'),
              ('gothic1','.g1Mode{'),
              ('risen2','.r2Mode{'),
              ('skyrim','.skMode{'),
              ('anachronox','.anMode{'),
          ])

          world_text=Path('css/world.css').read_text(encoding='utf-8')
          world='css/world-01-shop-shared.css'
          Path(world).write_text(world_text,encoding='utf-8')
          Path('css/world.css').unlink()

          motion=Path('css/motion.css').read_text(encoding='utf-8')
          markers=[
              (0,'tools-shared'),
              (motion.find('.worldMapScreen{'),'map'),
              (motion.find('.lairScene{'),'lair'),
              (motion.find('#lock.universalLockBlock'),'universal-lock'),
              (motion.find('.inventoryDrawer'),'inventory'),
              (motion.find('.digitalMode'),'digital'),
              (motion.find('.lairWorkbenchHotspot'),'workbench'),
          ]
          assert all(i>=0 for i,_ in markers),markers
          markers=sorted(set(markers))
          assert markers[0][0]==0
          overrides=[]; pieces=[]
          for n,(start,label) in enumerate(markers):
              end=markers[n+1][0] if n+1<len(markers) else len(motion)
              piece=motion[start:end]
              path=Path('css')/f'overrides-{n+1:02d}-{label}.css'
              path.write_text(piece,encoding='utf-8')
              overrides.append(path.as_posix()); pieces.append(piece)
          assert ''.join(pieces)==motion
          Path('css/motion.css').unlink()

          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')
          anchor='<link rel="stylesheet" href="css/base.css">'
          obsolete=[
              '<link rel="stylesheet" href="css/modes.css">',
              '<link rel="stylesheet" href="css/world.css">',
              '<link rel="stylesheet" href="css/motion.css">',
              '<link rel="stylesheet" href="css/mobile.css">',
          ]
          assert html.count(anchor)==1
          for link in obsolete:
              assert html.count(link)==1,(link,html.count(link))
              html=html.replace(link,'',1)
          ordered=['css/base.css',*modes,world,*overrides,'css/mobile.css']
          html=html.replace(anchor,'\n'.join(f'<link rel="stylesheet" href="{p}">' for p in ordered),1)
          html_path.write_text(html,encoding='utf-8')

          check_path=Path('scripts/check.mjs')
          check=check_path.read_text(encoding='utf-8')
          anchor="const scripts = localAttributeRefs(html, 'script', 'src');\n"
          assert check.count(anchor)==1
          expected=[
            'js/core/state.js','js/core/audio.js','js/core/ui.js',
            'js/world/inventory.js','js/world/lair.js','js/world/navigation-shop.js',
            'js/core/digital-helpers.js','js/modes/heat-cold.js','js/modes/drum.js','js/modes/oscilloscope.js',
            'js/core/game.js','js/modes/mass-effect.js','js/modes/anachronox.js','js/modes/composite.js',
            'js/modes/tension.js','js/modes/resonance.js','js/modes/deduction.js','js/modes/skyrim.js',
            'js/modes/risen2.js','js/modes/gothic1.js','js/modes/hillsfar.js','js/modes/base-locks.js',
            'js/core/init.js','js/core/inventory-hit-testing.js'
          ]
          insertion=(anchor+
            'const expectedScriptOrder = '+json.dumps(expected,separators=(',',':'))+';\n'+
            "if (JSON.stringify(scripts) !== JSON.stringify(expectedScriptOrder)) fail('JavaScript load order changed; classic scripts share one lexical environment.');\n")
          check=check.replace(anchor,insertion,1)
          check_path.write_text(check,encoding='utf-8')

          package=Path('package.json')
          data=json.loads(package.read_text(encoding='utf-8')); data['version']='0.254.0'
          package.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('VERSION').write_text('254\n',encoding='utf-8')

          Path('css/README.md').write_text('''# KEYNLOCK CSS architecture\n\nv254 preserves the v253 cascade while splitting large stylesheets into contiguous chronological fragments. File order in `index.html` is significant.\n\n- `base.css` — foundation, HUD and classic-lock base styles\n- `modes-01` … `modes-06` — Hillsfar, Mass Effect, Gothic 1, Risen 2, Skyrim and Anachronox base sections\n- `world-01-shop-shared.css` — shop plus shared early imported-mode overrides exactly where they originally lived\n- `overrides-*` — later tools/shared, map, lair, universal-lock, inventory, digital and workbench sections\n- `mobile.css` — final mobile layer and must remain last\n\nAll fragments stay directly in `css/`, so existing relative asset paths remain valid. Selectors are never regrouped across their original cascade positions.\n''',encoding='utf-8')
          Path('README.md').write_text('''# KEYNLOCK — v254\n\nBrowser lockpicking puzzle game. v254 keeps the v253 runtime and adds cascade-safe CSS modularization plus a locked JavaScript load-order check.\n\n- `index.html` — ordered CSS and JavaScript entry point\n- `css/base.css`, `css/modes-*.css`, `css/world-*.css`, `css/overrides-*.css`, `css/mobile.css` — cascade-preserving style architecture\n- `js/core/`, `js/world/`, `js/modes/` — modular runtime\n- `scripts/` — dependency-free local server, structural check and browser smoke\n- `vercel.json` — static deploy configuration\n\nLocal verification: `npm run check`, `npm run smoke`, `npm run dev`.\n\nStable checkpoints: `v250-stable`, `v251-stable`, `v252-stable`, `v253-stable`.\n''',encoding='utf-8')
          print('CSS order:',ordered)
          PY

          npm run check
          npm run smoke

      - name: Full interactive smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/keynlock-pw
          cd /tmp/keynlock-pw
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          cd "$GITHUB_WORKSPACE"
          node scripts/serve.mjs --port 8765 --quiet >/tmp/keynlock-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" NODE_PATH=/tmp/keynlock-pw/node_modules node <<'NODE'
          const {chromium}=require('playwright-core');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const errors=[];
            async function run(viewport,mobile){
              const page=await browser.newPage({viewport});
              page.on('pageerror',e=>errors.push('pageerror: '+e.message));
              page.on('response',r=>{const u=r.url();if(r.status()>=400&&u.startsWith('http://127.0.0.1:8765/')&&!u.endsWith('/favicon.ico'))errors.push(`HTTP ${r.status()} ${u}`)});
              const response=await page.goto('http://127.0.0.1:8765/',{waitUntil:'load',timeout:15000}); assert(response?.ok(),'root failed');
              await page.waitForTimeout(350);
              const ids=['tabClassic','tabTarget','tabLine','tabAlt2','tabSpecial','tabHillsfar','tabMass','tabG1','tabR2','tabSkyrim','tabAnach','tabTension','tabResonance','tabDeduction','tabComposite','tabHeatCold','tabDrum','tabScope'];
              for(const id of ids){await page.locator('#'+id).evaluate(el=>el.click());await page.waitForTimeout(40)}
              if(mobile){
                await page.locator('#mobileModeMenuButton').click({force:true}); await page.waitForTimeout(70); assert(await page.locator('body.mobile-mode-menu-open').count()===1,'mobile menu failed');
                await page.locator('#tabClassic').click({force:true}); await page.waitForTimeout(70); assert(await page.locator('body.mobile-mode-menu-open').count()===0,'mobile menu did not close');
              }else{
                await page.locator('#mapTab').click({force:true}); await page.waitForTimeout(70); assert(await page.locator('#worldMapScreen:not([hidden])').count()===1,'map failed'); await page.locator('#worldMapClose').click({force:true});
                await page.locator('#lairHudButton').click({force:true}); await page.waitForTimeout(70); assert(await page.locator('#lairOverlay:not([hidden])').count()===1,'lair failed'); await page.locator('#lairClose').click({force:true}); await page.waitForTimeout(70); if(await page.locator('#worldMapScreen:not([hidden])').count())await page.locator('#worldMapClose').click({force:true});
                await page.locator('#shopHudButton').click({force:true}); await page.waitForTimeout(70); assert(await page.locator('#shopOverlay.open').count()===1,'shop failed'); await page.locator('#shopClose').click({force:true});
              }
              await page.close();
            }
            await run({width:1440,height:900},false); await run({width:390,height:844},true); await browser.close();
            if(errors.length)throw new Error(errors.join('\n')); console.log('KEYNLOCK v254 interactive smoke OK');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Commit v254
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github
          rm -f V254_DIAGNOSTIC.log V254_FINAL_DIAGNOSTIC.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "KEYNLOCK v254: cascade-safe CSS architecture"
          git push
