name: Diagnose v252 source patterns

on:
  push:
    paths:
      - .github/workflows/diag-v252-patterns.yml

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('js/app.js').read_text(encoding='utf-8')
          q=chr(34)
          pats=[
            '`url('+q+'${currentLockBodySkin()}'+q+')`',
            '`url('+q+'${currentLockerSkin()}'+q+')`',
            '`url('+q+'${uri}'+q+')`',
            '`url('+q+'${pinSkin}'+q+')`',
            '`url('+q+'${plateSkin}'+q+')`',
          ]
          out=[]
          out.append('anchor='+str(text.count('  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}\n')))
          for p in pats: out.append(repr(p)+' count='+str(text.count(p)))
          out.append('dynamic url lines:')
          for i,l in enumerate(text.splitlines(),1):
              if 'url(' in l and '${' in l: out.append(f'{i}: {l.strip()}')
          out.append('tail='+str(text.count('/* Inventory visual hit testing */')))
          Path('V252_PATTERN_REPORT.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V252_PATTERN_REPORT.txt
          git commit -m "Record v252 source pattern counts"
          git push
