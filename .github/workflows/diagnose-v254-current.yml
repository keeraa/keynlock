name: Diagnose current KEYNLOCK v254

on:
  push:
    paths:
      - .github/workflows/diagnose-v254-current.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run current transform and all checks
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/v254-current.log) 2>&1
          echo '=== transform ==='
          python3 - <<'PY'
          from pathlib import Path
          import json
          def write_chunks(source,prefix,markers):
              text=Path(source).read_text(encoding='utf-8'); found=[]
              for label,marker in markers:
                  i=text.find(marker); assert i>=0,(source,label,marker); found.append((i,label))
              found.sort(); assert found[0][0]==0
              paths=[]; pieces=[]
              for n,(start,label) in enumerate(found):
                  end=found[n+1][0] if n+1<len(found) else len(text); piece=text[start:end]
                  p=Path('css')/f'{prefix}-{n+1:02d}-{label}.css'; p.write_text(piece,encoding='utf-8'); paths.append(p.as_posix()); pieces.append(piece)
              assert ''.join(pieces)==text; Path(source).unlink(); return paths
          modes=write_chunks('css/modes.css','modes',[('hillsfar','.hillsfarMode{'),('mass-effect','.massMode{'),('gothic1','.g1Mode{'),('risen2','.r2Mode{'),('skyrim','.skMode{'),('anachronox','.anMode{')])
          world='css/world-01-shop-shared.css'; Path(world).write_text(Path('css/world.css').read_text(encoding='utf-8'),encoding='utf-8'); Path('css/world.css').unlink()
          motion=Path('css/motion.css').read_text(encoding='utf-8'); raw=[(0,'tools-shared'),(motion.find('.worldMapScreen{'),'map'),(motion.find('.lairScene{'),'lair'),(motion.find('#lock.universalLockBlock'),'universal-lock'),(motion.find('.inventoryDrawer'),'inventory'),(motion.find('.digitalMode'),'digital'),(motion.find('.lairWorkbenchHotspot'),'workbench')]; assert all(i>=0 for i,_ in raw),raw; raw=sorted(set(raw)); over=[]; pieces=[]
          for n,(start,label) in enumerate(raw):
              end=raw[n+1][0] if n+1<len(raw) else len(motion); piece=motion[start:end]; p=Path('css')/f'overrides-{n+1:02d}-{label}.css'; p.write_text(piece,encoding='utf-8'); over.append(p.as_posix()); pieces.append(piece)
          assert ''.join(pieces)==motion; Path('css/motion.css').unlink()
          h=Path('index.html').read_text(encoding='utf-8'); anchor='<link rel="stylesheet" href="css/base.css">'; obsolete=['<link rel="stylesheet" href="css/modes.css">','<link rel="stylesheet" href="css/world.css">','<link rel="stylesheet" href="css/motion.css">','<link rel="stylesheet" href="css/mobile.css">']; assert h.count(anchor)==1
          for link in obsolete: assert h.count(link)==1,(link,h.count(link)); h=h.replace(link,'',1)
          ordered=['css/base.css',*modes,world,*over,'css/mobile.css']; h=h.replace(anchor,'\n'.join(f'<link rel="stylesheet" href="{p}">' for p in ordered),1); Path('index.html').write_text(h,encoding='utf-8')
          print('ordered CSS',ordered)
          PY
          echo transform_rc=$?
          echo '=== check ==='; npm run check; echo check_rc=$?
          echo '=== smoke ==='; npm run smoke; echo smoke_rc=$?
          echo '=== full browser ==='
          mkdir -p /tmp/keynlock-pw; cd /tmp/keynlock-pw; npm init -y >/dev/null 2>&1; npm install --silent --no-save playwright-core@1.55.0; cd "$GITHUB_WORKSPACE"
          node scripts/serve.mjs --port 8765 --quiet >/tmp/keynlock-http.log 2>&1 & SERVER_PID=$!; sleep 1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NODE_PATH=/tmp/keynlock-pw/node_modules node <<'NODE'
          const {chromium}=require('playwright-core'); const A=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{const b=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']}); const ids=['tabClassic','tabTarget','tabLine','tabAlt2','tabSpecial','tabHillsfar','tabMass','tabG1','tabR2','tabSkyrim','tabAnach','tabTension','tabResonance','tabDeduction','tabComposite','tabHeatCold','tabDrum','tabScope'];
          for(const [name,vp,mob] of [['desktop',{width:1440,height:900},false],['mobile',{width:390,height:844},true]]){const p=await b.newPage({viewport:vp}); const es=[]; p.on('pageerror',e=>es.push(e.message)); p.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico'))es.push(`${r.status()} ${r.url()}`)}); const r=await p.goto('http://127.0.0.1:8765/',{waitUntil:'load',timeout:15000}); A(r?.ok(),name+' root'); await p.waitForTimeout(300); for(const id of ids){await p.locator('#'+id).evaluate(el=>el.click()); await p.waitForTimeout(30)}; if(mob){await p.locator('#mobileModeMenuButton').click({force:true});await p.waitForTimeout(60);A(await p.locator('body.mobile-mode-menu-open').count()===1,'mobile open');await p.locator('#tabClassic').click({force:true});await p.waitForTimeout(60);A(await p.locator('body.mobile-mode-menu-open').count()===0,'mobile close')}else{await p.locator('#mapTab').click({force:true});await p.waitForTimeout(60);A(await p.locator('#worldMapScreen:not([hidden])').count()===1,'map');await p.locator('#worldMapClose').click({force:true});await p.locator('#lairHudButton').click({force:true});await p.waitForTimeout(60);A(await p.locator('#lairOverlay:not([hidden])').count()===1,'lair');await p.locator('#lairClose').click({force:true});await p.waitForTimeout(60);if(await p.locator('#worldMapScreen:not([hidden])').count())await p.locator('#worldMapClose').click({force:true});await p.locator('#shopHudButton').click({force:true});await p.waitForTimeout(60);A(await p.locator('#shopOverlay.open').count()===1,'shop')}; console.log(name,'errors',es); A(es.length===0,name+' errors'); await p.close()} await b.close(); console.log('full browser OK')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          echo browser_rc=$?
          kill $SERVER_PID 2>/dev/null || true
          echo '=== HTTP 4xx/5xx ==='; grep -E ' [45][0-9][0-9] ' /tmp/keynlock-http.log || true
          cp /tmp/v254-current.log /tmp/V254_CURRENT_DIAGNOSTIC.log
      - name: Save log
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          cp /tmp/V254_CURRENT_DIAGNOSTIC.log V254_CURRENT_DIAGNOSTIC.log
          rm -f .github/workflows/diagnose-v254-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record current v254 diagnostic" || true
          git push || true
