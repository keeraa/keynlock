name: Diagnose final v254 CSS split

on:
  push:
    paths:
      - .github/workflows/diagnose-v254-final.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce CSS split and checks
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/v254-final-diagnostic.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          def chunks(source,prefix,markers):
              text=Path(source).read_text(encoding='utf-8'); found=[]
              for label,marker in markers:
                  i=text.find(marker); print(source,label,i); assert i>=0,(source,label,marker); found.append((i,label))
              found.sort(); assert found[0][0]==0
              paths=[]; pieces=[]
              for n,(start,label) in enumerate(found):
                  end=found[n+1][0] if n+1<len(found) else len(text); piece=text[start:end]
                  p=Path('css')/f'{prefix}-{n+1:02d}-{label}.css'; p.write_text(piece,encoding='utf-8'); paths.append(p.as_posix()); pieces.append(piece)
              assert ''.join(pieces)==text; Path(source).unlink(); return paths
          modes=chunks('css/modes.css','modes',[('hillsfar','.hillsfarMode{'),('mass-effect','.massMode{'),('gothic1','.g1Mode{'),('risen2','.r2Mode{'),('skyrim','.skMode{'),('anachronox','.anMode{')])
          world='css/world-01-shop-shared.css'; Path(world).write_text(Path('css/world.css').read_text(encoding='utf-8'),encoding='utf-8'); Path('css/world.css').unlink()
          motion=Path('css/motion.css').read_text(encoding='utf-8')
          raw=[(0,'tools-shared'),(motion.find('.worldMapScreen{'),'map'),(motion.find('.lairScene{'),'lair'),(motion.find('#lock.universalLockBlock'),'universal-lock'),(motion.find('.inventoryDrawer'),'inventory'),(motion.find('.digitalMode'),'digital'),(motion.find('.lairWorkbenchHotspot'),'workbench')]
          print('motion markers',raw); assert all(i>=0 for i,_ in raw)
          raw=sorted(set(raw)); over=[]; pieces=[]
          for n,(start,label) in enumerate(raw):
              end=raw[n+1][0] if n+1<len(raw) else len(motion); piece=motion[start:end]
              p=Path('css')/f'overrides-{n+1:02d}-{label}.css'; p.write_text(piece,encoding='utf-8'); over.append(p.as_posix()); pieces.append(piece)
          assert ''.join(pieces)==motion; Path('css/motion.css').unlink()
          h=Path('index.html').read_text(encoding='utf-8')
          old='\n'.join(['<link rel="stylesheet" href="css/base.css">','<link rel="stylesheet" href="css/modes.css">','<link rel="stylesheet" href="css/world.css">','<link rel="stylesheet" href="css/motion.css">','<link rel="stylesheet" href="css/mobile.css">'])
          print('old link block count',h.count(old)); assert h.count(old)==1
          ordered=['css/base.css',*modes,world,*over,'css/mobile.css']; h=h.replace(old,'\n'.join(f'<link rel="stylesheet" href="{p}">' for p in ordered),1); Path('index.html').write_text(h,encoding='utf-8')
          print('ordered',ordered)
          PY
          echo transform_rc=$?
          npm run check
          echo check_rc=$?
          npm run smoke
          echo smoke_rc=$?
          echo '=== interactive ==='
          mkdir -p /tmp/keynlock-pw; cd /tmp/keynlock-pw; npm init -y >/dev/null 2>&1; npm install --silent --no-save playwright-core@1.55.0; cd "$GITHUB_WORKSPACE"
          node scripts/serve.mjs --port 8765 --quiet >/tmp/keynlock-http.log 2>&1 & SERVER_PID=$!; sleep 1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NODE_PATH=/tmp/keynlock-pw/node_modules node <<'NODE'
          const {chromium}=require('playwright-core');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});const p=await b.newPage({viewport:{width:1440,height:900}});const errs=[];p.on('pageerror',e=>errs.push(e.message));const r=await p.goto('http://127.0.0.1:8765/',{waitUntil:'load',timeout:15000});console.log('root',r?.status());const ids=['tabClassic','tabTarget','tabLine','tabAlt2','tabSpecial','tabHillsfar','tabMass','tabG1','tabR2','tabSkyrim','tabAnach','tabTension','tabResonance','tabDeduction','tabComposite','tabHeatCold','tabDrum','tabScope'];for(const id of ids){await p.locator('#'+id).evaluate(el=>el.click());await p.waitForTimeout(25)};console.log('pageerrors',errs);await b.close();if(errs.length)process.exit(2)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo interactive_rc=$?
          kill $SERVER_PID 2>/dev/null || true
          echo '=== http 4xx ==='; grep ' 4[0-9][0-9] ' /tmp/keynlock-http.log || true
          cp /tmp/v254-final-diagnostic.log /tmp/V254_FINAL_DIAGNOSTIC.log
      - name: Save diagnostic
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          cp /tmp/V254_FINAL_DIAGNOSTIC.log V254_FINAL_DIAGNOSTIC.log
          rm -f .github/workflows/diagnose-v254-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record final v254 diagnostic" || true
          git push || true
