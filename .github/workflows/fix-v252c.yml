name: Fix v252c quote matching

on:
  push:
    paths:
      - .github/workflows/fix-v252c.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix over-escaped quote patterns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-v252c.yml')
          t=p.read_text(encoding='utf-8')
          bad=chr(92)+chr(92)+chr(34)
          good=chr(92)+chr(34)
          count=t.count(bad)
          print('overescaped quote sequences:',count)
          assert count==12,count
          p.write_text(t.replace(bad,good),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-v252c.yml
          git commit -m "Fix v252 asset URL matcher"
          git push
