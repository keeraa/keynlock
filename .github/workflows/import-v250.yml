name: Import KEYNLOCK v250

on:
  push:
    paths:
      - keynlock-v250.zip

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand v250 project
        shell: bash
        run: |
          set -euo pipefail
          test -f keynlock-v250.zip
          rm -rf /tmp/keynlock-v250
          mkdir -p /tmp/keynlock-v250
          unzip -q keynlock-v250.zip -d /tmp/keynlock-v250
          SOURCE=/tmp/keynlock-v250/lockpick-puzzle-v250-split
          test -f "$SOURCE/index.html"
          cp -a "$SOURCE"/. ./
          rm -f keynlock-v250.zip
          rm -f .github/workflows/import-v250.yml

      - name: Verify imported structure
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f css/app.css
          test -f css/mobile.css
          test -f js/app.js
          test -f ASSET_MANIFEST.tsv
          test -d assets
          test "$(find assets -type f | wc -l)" -eq 87

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import KEYNLOCK v250 split project"
          git push
