name: Lair and workshops
on:
  push:
    paths:
      - 'js/3d/scenes/lair/**'
      - 'js/3d/workshops/**'
      - 'js/3d/core/**'
      - 'js/3d/package.json'
      - 'js/3d/package-lock.json'
      - '.github/workflows/lair.yml'
  pull_request:
    paths:
      - 'js/3d/scenes/lair/**'
      - 'js/3d/workshops/**'
      - 'js/3d/core/**'
      - 'js/3d/package.json'
      - 'js/3d/package-lock.json'
      - '.github/workflows/lair.yml'

jobs:
  lair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # js/3d is an npm workspace: the Lair and the workshop packages share one install.
    defaults:
      run:
        working-directory: js/3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: js/3d/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lair syntax, unit and geometry checks
        run: npm run check -w keynlock-lair
      - name: Atelier tests
        run: npm test -w @keynlock/atelier
      - name: Single source per workshop
        run: npm run check:sources -w keynlock-lair
      - name: Standalone workshop sites build
        run: |
          npm run build -w @keynlock/alchemy
          npm run build -w @keynlock/atelier
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser -w keynlock-lair
