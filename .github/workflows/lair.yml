name: Lair and workshops
on:
  push:
    branches: [main]
    paths:
      - 'js/3d/scenes/lair/**'
      - 'js/3d/workshops/**'
      - 'js/3d/core/**'
      - 'js/3d/package.json'
      - 'js/3d/package-lock.json'
      - '.github/workflows/lair.yml'
  pull_request:
    paths:
      - 'js/3d/scenes/lair/**'
      - 'js/3d/workshops/**'
      - 'js/3d/core/**'
      - 'js/3d/package.json'
      - 'js/3d/package-lock.json'
      - '.github/workflows/lair.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lair:
    runs-on: ubuntu-latest
    # Each shard gets its own runner because software WebGL is CPU-bound.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: Lair browser (${{ matrix.shard }}/3)
    # js/3d is an npm workspace: the Lair and the workshop packages share one install.
    defaults:
      run:
        working-directory: js/3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: js/3d/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lair syntax, unit and geometry checks
        run: npm run check -w keynlock-lair
      - name: Atelier tests
        run: npm test -w @keynlock/atelier
      - name: Single source per workshop
        run: npm run check:sources -w keynlock-lair
      - name: Standalone workshop sites build
        run: |
          npm run build -w @keynlock/alchemy
          npm run build -w @keynlock/atelier
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: js/3d/scenes/lair
        run: |
          npm run build
          node --test --test-shard=${{ matrix.shard }}/3 tests/browser/*.test.mjs
