name: Patch KEYNLOCK v252 smoke test

on:
  push:
    paths:
      - .github/workflows/patch-v252-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-v252c.yml')
          s=p.read_text(encoding='utf-8')
          old="for(const id of ids){await page.locator('#'+id).click({force:true});await page.waitForTimeout(45);}"
          new="for(const id of ids){await page.locator('#'+id).evaluate(el=>el.click());await page.waitForTimeout(45);}"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old_mobile="""await page.locator('#mobileModeMenuButton').click({force:true});
                await page.waitForTimeout(70);
                assert(await page.locator('body.mobile-mode-menu-open').count()===1,'mobile menu failed');
                await page.locator('#tabMass').click({force:true});"""
          new_mobile="""await page.locator('#mobileModeMenuButton').click({force:true});
                await page.waitForTimeout(70);
                assert(await page.locator('body.mobile-mode-menu-open').count()===1,'mobile menu failed');
                await page.locator('#tabClassic').click({force:true});
                await page.waitForTimeout(70);
                assert(await page.locator('body.mobile-mode-menu-open').count()===0,'mobile menu did not close after mode selection');"""
          assert s.count(old_mobile)==1, s.count(old_mobile)
          s=s.replace(old_mobile,new_mobile,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/patch-v252-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix v252 mobile smoke test"
          git push
