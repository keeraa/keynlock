name: Patch v252c matcher robustly

on:
  push:
    paths:
      - .github/workflows/patch-v252c.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace matcher block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-v252c.yml')
          t=p.read_text(encoding='utf-8')
          a=t.index('          replacements=[\n')
          b=t.index('          for old,new in replacements:\n',a)
          block='''          q=chr(34)\n          replacements=[\n            ('`url('+q+'${currentLockBodySkin()}'+q+')`','cssUrl(currentLockBodySkin())'),\n            ('`url('+q+'${currentLockerSkin()}'+q+')`','cssUrl(currentLockerSkin())'),\n            ('`url('+q+'${uri}'+q+')`','cssUrl(uri)'),\n            ('`url('+q+'${pinSkin}'+q+')`','cssUrl(pinSkin)'),\n            ('`url('+q+'${plateSkin}'+q+')`','cssUrl(plateSkin)'),\n          ]\n'''
          t=t[:a]+block+t[b:]
          t=t.replace('c=text.count(old)\n              assert c==1,(old,c)\n              text=text.replace(old,new,1)','c=text.count(old)\n              expected=2 if old==replacements[2][0] else 1\n              assert c==expected,(old,c,expected)\n              text=text.replace(old,new,expected)')
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-v252c.yml
          git commit -m "Make v252 URL matcher robust"
          git push
