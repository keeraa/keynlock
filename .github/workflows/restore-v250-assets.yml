name: Restore missing v250 assets

on:
  push:
    paths:
      - .github/workflows/restore-v250-assets.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact files
        shell: bash
        run: |
          set -o pipefail
          (
          set -euo pipefail
          ARCHIVE_COMMIT=eb24d51afc2c53b6a7bbd4dab9be66f2f0b8cda4
          git cat-file -e "$ARCHIVE_COMMIT:lockpick-puzzle-v250-split.zip"
          git show "$ARCHIVE_COMMIT:lockpick-puzzle-v250-split.zip" > /tmp/v250.zip
          unzip -t /tmp/v250.zip >/dev/null
          for rel in assets/backgrounds/lair-overlay.jpg assets/lair/lair-background.png assets/locks/default-lock.webp; do
            mkdir -p "$(dirname "$rel")"
            unzip -p /tmp/v250.zip "lockpick-puzzle-v250-split/$rel" > "$rel"
            test -s "$rel"
            echo "$rel $(wc -c < "$rel") bytes"
          done
          rm /tmp/v250.zip
          ) 2>&1 | tee /tmp/restore.log
      - name: Commit failure log
        if: failure()
        shell: bash
        run: |
          cp /tmp/restore.log RESTORE_ASSETS_FAILURE.log 2>/dev/null || echo restore-failed > RESTORE_ASSETS_FAILURE.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESTORE_ASSETS_FAILURE.log
          git commit -m "Record asset restore failure" || true
          git push || true
      - name: Commit restored files
        if: success()
        shell: bash
        run: |
          rm -f RESTORE_ASSETS_FAILURE.log .github/workflows/restore-v250-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore omitted v250 assets"
          git push
