<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEYNLOCK — Lockpicking Mechanics v23</title>
<style>html,body{margin:0;min-height:100%;background:#0d100d;color:#eee4ca;font:16px system-ui,sans-serif}body{display:grid;place-items:center}.loading{padding:24px;text-align:center;color:#aaa38e}.error{max-width:560px;line-height:1.5;color:#d9a09a}</style>
</head>
<body>
<div class="loading" id="loading">Загрузка прототипа…</div>
<script>
(async()=>{
  try{
    const files=[
      'prototype-v23/chunk-00.txt',
      'prototype-v23/chunk-01.txt',
      'prototype-v23/chunk-23.txt',
      'prototype-v23/chunk-45.txt',
      'prototype-v23/chunk-67.txt'
    ];
    const parts=await Promise.all(files.map(async file=>{
      const res=await fetch(file,{cache:'no-store'});
      if(!res.ok)throw new Error(`${file}: HTTP ${res.status}`);
      return res.text();
    }));
    const b64=parts.join('').trim();
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    if(typeof DecompressionStream!=='function')throw new Error('Браузер не поддерживает DecompressionStream');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML=`<div class="loading error"><strong>Не удалось загрузить прототип.</strong><br>${String(error&&error.message||error)}</div>`;
  }
})();
</script>
</body>
</html>
