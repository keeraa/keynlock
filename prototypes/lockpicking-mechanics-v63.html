<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прототипы взлома</title>

<style>
:root {
  --bg:#0d100d;
  --panel:#151913;
  --panel2:#1e231b;
  --line:#343a2f;
  --line2:#555d48;
  --ink:#eee4ca;
  --muted:#9c9681;
  --gold:#d8b871;
  --good:#7bbf78;
  --bad:#b9655c;
  --blue:#5ca4d9;
  --white:#cfd3cc;
}
* {
  box-sizing:border-box
}
html,body {
  margin:0;
  min-height:100%;
  background:radial-gradient(circle at 50% -20%,#2b2e23 0,#151812 44%,#0b0d0a 100%);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif
}
button {
  font:inherit
}
.app {
  width:min(760px,100%);
  margin:auto;
  padding:18px
}
.tabs {
  display:flex;
  gap:10px;
  margin-bottom:12px
}
.tab {
  flex:1;
  border:1px solid var(--line);
  background:#151913;
  color:#aaa38e;
  padding:12px 14px;
  border-radius:14px;
  cursor:pointer
}
.tab.has-check {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px
}
.tab-check {
  color:#91a870;
  font-weight:800;
  font-size:14px;
  line-height:1
}
.tab.active {
  background:#2a3024;
  color:white;
  border-color:#68705a
}
.stage {
  border:1px solid #30362b;
  border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(0,0,0,.08)),#121510;
  overflow:hidden
}
.scene {
  display:none;
  padding:24px;
  min-height:700px
}
.scene.active {
  display:block
}
.scene-head {
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-bottom:12px
}
.scene-head h2 {
  font:500 30px/1.05 Georgia,serif;
  margin:0 0 8px
}.status {
  text-align:right;
  min-width:170px;
  color:#aaa38e;
  font-size:12px
}
.status strong {
  display:block;
  color:#f4ead1;
  font-size:15px;
  margin-bottom:3px
}
.status[data-score]::after {
  content:attr(data-score);
  display:block;
  margin-top:8px;
  padding-top:7px;
  border-top:1px solid rgba(255,255,255,.08);
  color:#d8b871;
  font:600 11px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:nowrap
}
.lab {
  min-height:560px;
  border:1px solid #292f25;
  border-radius:20px;
  padding:22px;
  background:rgba(255,255,255,.012);
  display:flex;
  align-items:center;
  justify-content:center
}
.btn {
  border:1px solid #4b5241;
  background:#262b21;
  color:var(--ink);
  padding:11px 15px;
  border-radius:12px;
  cursor:pointer
}
.btn:hover {
  border-color:#747c63
}
.btn.active {
  border-color:var(--gold);
  background:#342d20
}.meters {
  width:100%;
  display:grid;
  gap:10px
}
.meter-head {
  display:flex;
  justify-content:space-between;
  color:#aaa38e;
  font-size:11px;
  margin-bottom:5px
}
.bar {
  height:9px;
  border-radius:999px;
  background:#0e110d;
  border:1px solid #31372c;
  overflow:hidden
}
.bar>span {
  display:block;
  height:100%;
  width:0;
  background:#899d6d;
  transition:width .08s linear
}
/* Museum expansion */ .museum-wrap {
  width:min(620px,100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px
}
.museum-panel {
  width:100%;
  border:1px solid #3d4538;
  border-radius:18px;
  background:#111610;
  padding:18px;
  box-shadow:inset 0 0 28px rgba(0,0,0,.3)
}
.museum-actions {
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap
}
.museum-msg {
  min-height:20px;
  text-align:center;
  color:#bbb49d;
  font-size:12px
}
/* v5 — unified keyboard focus */ .kb-focus {
  outline:2px solid var(--gold)!important;
  outline-offset:2px!important;
  box-shadow:0 0 0 3px rgba(214,179,111,.12)!important
}
/* v8 clarity */ .scene-badge {
  display:inline-block;
  vertical-align:.18em;
  margin-left:7px;
  padding:3px 7px;
  border:1px solid #806c4d;
  border-radius:999px;
  color:#d8bd78;
  font:600 9px/1 Inter,system-ui,sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase
}
/* Mobile controls */ .sf-lock,.me1-arena {
  touch-action:none
}
.btn,.tab,.tumbler-slot,.pick-type {
  -webkit-tap-highlight-color:transparent
}
@media(max-width:650px) {
  .app {
    padding-left:max(12px,env(safe-area-inset-left));
    padding-right:max(12px,env(safe-area-inset-right));
    padding-bottom:max(16px,env(safe-area-inset-bottom))
  }
  .scene {
    padding:14px
  }
  .lab {
    padding:12px
  }
  .scene-head {
    margin-bottom:14px
  }
  .btn,.tab {
    min-height:46px;
    touch-action:manipulation
  }
  .museum-actions,.bio-actions,.r2-actions {
    width:100%
  }
  .museum-actions .btn,.bio-actions .btn,.r2-actions .btn {
    flex:1 1 112px
  }
  .th12-profiles .btn {
    min-height:72px;
    touch-action:none
  }
  .tumbler-slot {
    touch-action:manipulation
  }
  .tds-lock,.kcd-lock,.sf-lock {
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none
  }
}
@media(max-width:650px) {
  .tabs {
    overflow-x:auto;
    gap:6px
  }
  .tab {
    flex:0 0 auto;
    min-width:112px;
    padding:10px 7px;
    font-size:12px
  }
  .scene-head {
    display:block
  }
  .status {
    text-align:left;
    margin-top:10px
  }
}
@keyframes shake {
  25% {
    translate:-1px .5px
  }
  75% {
    translate:1px -.5px
  }
}
/* Alpha Protocol */
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-lock {
  height:330px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  align-items:stretch;
  position:relative;
  padding:12px
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-line {
  position:absolute;
  left:4%;
  right:4%;
  top:50%;
  height:2px;
  transform:translateY(-50%);
  background:transparent;
  box-shadow:none;
  z-index:1;
  pointer-events:none
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-pin {
  position:relative;
  border:1px solid #454b3d;
  border-radius:12px;
  background:#121711;
  overflow:hidden
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-pin.active {
  border-color:#8d7a50
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-pin.set {
  border-style:dashed;
  border-color:#769066;
  border-width:1px;
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-pin.set.active {
  border-style:solid;
  border-color:#8fa57c;
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-beam {
  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:6px;
  transform:translateY(-50%);
  pointer-events:none;
  z-index:6;
  overflow:hidden
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-beam-fill {
  position:relative;
  display:block;
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,rgba(245,210,96,.0) 0%,rgba(245,210,96,.3) 10%,rgba(245,210,96,.9) 55%,rgba(255,242,182,.35) 100%);
  box-shadow:0 0 10px rgba(245,210,96,.36);
  transition:width .14s ease-out
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-beam-fill::after {
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 14px,rgba(255,247,205,.82) 14px 20px,rgba(255,255,255,0) 20px 34px);
  animation:apBeamFlow .85s linear infinite
}
@keyframes apBeamFlow {
  from { transform:translateX(-30px) }
  to { transform:translateX(0) }
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-shaft {
  position:absolute;
  left:25%;
  right:25%;
  height:52%;
  top:var(--y,24%);
  background:linear-gradient(90deg,#6d705f,#a29c82,#656858);
  border-radius:5px;
  transition:top .05s;
  overflow:visible;
  z-index:1
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-groove {
  position:absolute;
  left:-3px;
  right:-3px;
  top:var(--groove,55%);
  height:12px;
  transform:translateY(-50%);
  background:#0d100c;
  border-top:1px solid #c1b58f;
  border-bottom:1px solid #c1b58f;
  z-index:1
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-pin.ready {
  border-color:#d6b871;
  border-style:dashed;
  box-shadow:inset 0 0 0 1px rgba(214,184,113,.22)
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-pin.ready.active {
  border-style:solid;
  box-shadow:0 0 0 1px rgba(214,184,113,.28),inset 0 0 0 1px rgba(214,184,113,.18)
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-pin.ready .ap-groove {
  background:#302819;
  border-color:#efd38b
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-pin.set .ap-shaft {
  filter:sepia(.2) hue-rotate(45deg);
  box-shadow:0 0 10px rgba(123,191,120,.24)
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-time {
  height:8px;
  background:#0b0e0b;
  border:1px solid #33392f;
  border-radius:99px;
  overflow:hidden
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-time span {
  display:block;
  height:100%;
  background:#9e8253
}
@media(max-width:650px) {
  .lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-lock {
    height:270px;
    gap:5px;
    padding-inline:2px
  }
}

.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-symbol {
  position:absolute;left:50%;top:var(--symbol-top,18%);width:30px;height:30px;
  transform:translate(-50%,-50%);z-index:1;color:#e4dcc3;opacity:.96;pointer-events:none;background:rgba(73,72,60,.92);border-radius:50%;padding:3px
}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-symbol svg {width:100%;height:100%;overflow:visible}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-symbol path {fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}

.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-sequence{display:grid;grid-template-columns:repeat(5,42px);justify-content:center;gap:8px;margin-top:14px}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-seq-item{width:42px;height:42px;border:1px solid #454b3d;border-radius:10px;display:grid;place-items:center;color:#b8b39e;background:#101510}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-seq-item svg{width:24px;height:24px}.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-seq-item path{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-seq-item.current{border-color:var(--gold);color:#efd38b}.lockpick-prototype .scene[data-name="Alpha Protocol"] .ap-seq-item.done{border-color:#6e8f61;color:#8eb27b;background:#172016}
/* Shared controls and symbols */
.lockpick-prototype .restart-icon-btn{width:44px;min-width:44px;height:44px;padding:0!important;border-radius:12px;display:inline-grid;place-items:center;line-height:1}
.lockpick-prototype .restart-icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Shared title lockpick counter */
.lockpick-prototype .scene-title-row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap
}
.lockpick-prototype .scene-title-row h2{
  margin:0
}
.lockpick-prototype .head-picks{
  flex:0 0 auto;
  border:1px solid #353c30;
  background:#151913;
  border-radius:10px;
  padding:7px 10px;
  color:#99927e;
  font-size:11px;
  white-space:nowrap
}
.lockpick-prototype .head-picks strong{
  color:#f0e6cc;
  font-size:14px;
  margin-left:4px
}
@media(max-width:650px){
  .lockpick-prototype .scene-title-row{
    gap:8px
  }
}

<body>
<div class="app lockpick-prototype">
  <div class="tabs" id="tabs"></div>
  <main class="stage">
    <section class="scene" data-name="Alpha Protocol" data-tab-check="true">
          <div class="scene-head"><div><div class="scene-title-row"><h2>Выравнивание пазов</h2><div class="head-picks">Отмычки <strong data-head-picks>3</strong></div></div></div><div class="status" id="apStatus"><strong>0 / 5</strong>Выставляй пины в порядке символов под замком</div></div>
          <div class="lab"><div class="museum-wrap"><div class="museum-panel"><div class="ap-time"><span id="apTimer"></span></div><div class="ap-lock" id="apLock"><div class="ap-beam"><span class="ap-beam-fill" id="apBeamFill"></span></div><div class="ap-line"></div></div><div class="ap-sequence" id="apSequence" aria-label="Порядок символов"></div></div><div class="museum-msg" id="apMsg"></div></div></div>

        </section>
  </main>
</div>

<script>
// KEYNLOCK mechanics prototype core.
// Games register a small portable adapter: reset / enter / leave / keydown / keyup / tick.
const GameHub=(()=>{
  const root=document.querySelector('.lockpick-prototype');
  const scenes=[...root.querySelectorAll('.scene')];
  const tabs=root.querySelector('#tabs');
  const games=new Map();
  const restartIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"></path><path d="M18.5 15a7 7 0 1 1 .5-7"></path></svg>';
  let booted=false,rafId=0;

  function activeName(){return root.querySelector('.scene.active')?.dataset.name||''}
  function scene(name){return scenes.find(s=>s.dataset.name===name)||null}
  function register(name,api){games.set(name,api||{})}
  function get(name=activeName()){return games.get(name)||null}
  function show(i,initial=false){
    const next=scenes[i];
    if(!next)return;
    const prevName=activeName();
    if(!initial)games.get(prevName)?.leave?.();
    scenes.forEach((s,j)=>s.classList.toggle('active',i===j));
    [...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));
    games.get(next.dataset.name)?.enter?.();
  }
  function resetAll(){for(const s of scenes)games.get(s.dataset.name)?.reset?.()}
  function frame(now){
    games.get(activeName())?.tick?.(now);
    rafId=requestAnimationFrame(frame);
  }
  function startLoop(){if(!rafId)rafId=requestAnimationFrame(frame)}
  function boot(){
    if(booted)return; booted=true;
    root.querySelectorAll('button[id$="Reset"]').forEach(b=>{
      const old=b.textContent.trim();
      b.classList.add('restart-icon-btn');
      b.title=old||'Перезапустить';
      b.setAttribute('aria-label',old||'Перезапустить');
      b.innerHTML=restartIcon;
    });
    tabs.innerHTML='';
    scenes.forEach((s,i)=>{
      const b=document.createElement('button');
      b.className='tab'+(s.classList.contains('active')?' active':'')+(s.dataset.tabCheck==='true'?' has-check':'');
      const label=s.dataset.tabLabel||s.dataset.name;
      b.innerHTML=s.dataset.tabCheck==='true'?`<span class="tab-check">✓</span><span>${label}</span>`:label;
      b.onclick=()=>show(i);
      tabs.appendChild(b);
    });
    resetAll();
    LockRuntime.initAll();
    const initial=Math.max(0,scenes.findIndex(s=>s.classList.contains('active')));
    show(initial,true);
    startLoop();
  }
  document.addEventListener('keydown',e=>{if(get()?.keydown?.(e)===true)e.preventDefault()});
  document.addEventListener('keyup',e=>{if(get()?.keyup?.(e)===true)e.preventDefault()});
  return{root,scenes,register,get,scene,show,boot,resetAll,activeName};
})();

const scenes=GameHub.scenes;
function activeName(){return GameHub.activeName()}
function directionFromCode(code){
  if(code==='ArrowLeft'||code==='KeyA')return'left';
  if(code==='ArrowRight'||code==='KeyD')return'right';
  if(code==='ArrowUp'||code==='KeyW')return'up';
  if(code==='ArrowDown'||code==='KeyS')return'down';
  return null;
}
function angleDiff(a,b){return Math.abs(((a-b+540)%360)-180)}
function shuffled(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
const LOCK_SYMBOLS=[
  '<svg viewBox="0 0 48 48"><path d="M24 5V43"/></svg>',
  '<svg viewBox="0 0 48 48"><path d="M8 8H27Q38 8 38 20V43"/></svg>',
  '<svg viewBox="0 0 48 48"><path d="M25 5C14 11 35 17 24 24C14 31 35 37 24 43"/></svg>',
  '<svg viewBox="0 0 48 48"><path d="M14 43V23Q14 7 28 7Q41 7 41 22V25"/></svg>',
  '<svg viewBox="0 0 48 48"><path d="M39 6L14 24L39 43"/></svg>'

];

// Shared move-based scoring. A game opts in by calling scoreReset/scoreAction.
const EMBEDDED_PARAMS=new URLSearchParams(location.search);
const EMBEDDED_GAME=EMBEDDED_PARAMS.get('game')||'';
const EMBEDDED_PICK_VALUE=Number(EMBEDDED_PARAMS.get('picks'));
const EMBEDDED_TENSION_VALUE=Number(EMBEDDED_PARAMS.get('tension'));
const PLAYER_PICK_COUNT=Math.max(0,Math.min(99,Math.round(Number.isFinite(EMBEDDED_PICK_VALUE)?EMBEDDED_PICK_VALUE:3)));
let playerTensionSkin=Math.max(1,Math.min(5,Math.round(Number.isFinite(EMBEDDED_TENSION_VALUE)?EMBEDDED_TENSION_VALUE:1)));
const SCORE_BASE=1000,SCORE_STEP=50,scoreState={};
function scoreScene(game){return GameHub.scene(game)}
function scoreReset(game,ideal){ideal=Math.max(1,Math.round(ideal||1));scoreState[game]={moves:0,ideal};scoreRender(game)}
function scoreAction(game,n=1){const s=scoreState[game];if(!s)return;s.moves+=n;scoreRender(game)}
function scoreValue(game){const s=scoreState[game];if(!s)return SCORE_BASE;return Math.max(0,SCORE_BASE-Math.max(0,s.moves-s.ideal)*SCORE_STEP)}
function embeddedGoal(game){const status=scoreScene(game)?.querySelector(':scope > .scene-head .status');if(!status)return 'Выполнить взлом';return [...status.childNodes].filter(node=>!(node.nodeType===1&&node.matches?.('strong'))).map(node=>node.textContent||'').join(' ').replace(/\s+/g,' ').trim()||status.querySelector('strong')?.textContent||'Выполнить взлом'}
function emitEmbeddedState(game){if(game!==EMBEDDED_GAME)return;const s=scoreState[game];window.parent?.postMessage({type:'keynlock-mechanic-state',game,goal:embeddedGoal(game),moves:s?.moves,ideal:s?.ideal,reward:scoreValue(game)},location.origin)}
function scoreRender(game){const s=scoreState[game],scene=scoreScene(game);if(!s||!scene)return;const status=scene.querySelector('.status');if(status)status.dataset.score=`Очки ${scoreValue(game)} · ходы ${s.moves} · норма ${s.ideal}`;emitEmbeddedState(game)}

// Shared runtime used by every lock module. Keep game modules portable: they only
// own their puzzle state; lockpick stock and final open transition live here.
const LockRuntime=(()=>{
  const DEFAULT_PICKS=PLAYER_PICK_COUNT;
  const lastPicks={};
  const requiredTensions={};
  function scene(game){return GameHub.scene(game)}
  function counter(game){return scene(game)?.querySelector('[data-head-picks]')||null}
  function syncPicks(game,picks=DEFAULT_PICKS){
    const value=Math.max(0,Math.round(Number.isFinite(+picks)?+picks:DEFAULT_PICKS));
    const previous=lastPicks[game];lastPicks[game]=value;
    const el=counter(game);if(el)el.textContent=String(value);
    if(game===EMBEDDED_GAME&&Number.isFinite(previous)&&value<previous)window.parent?.postMessage({type:'keynlock-mechanic-picks',game,remaining:value,spent:previous-value},location.origin);
    return value
  }
  function resetPicks(game,state,count=DEFAULT_PICKS){if(state)state.picks=count;return syncPicks(game,count)}
  function breakPick(game,state,{count=1,messageEl=null,message='',emptyMessage='Отмычки закончились.',onEmpty=null}={}){
    if(!state)return 0;
    state.picks=Math.max(0,(Number.isFinite(+state.picks)?+state.picks:DEFAULT_PICKS)-count);
    syncPicks(game,state.picks);
    if(state.picks<=0){if(messageEl)messageEl.textContent=emptyMessage;onEmpty?.();window.parent?.postMessage({type:'keynlock-mechanic-loss',game},location.origin)}
    else if(messageEl&&message)messageEl.textContent=message;
    return state.picks
  }
  function setRequiredTension(game,symbolIndex){
    const required=Math.max(1,Math.min(5,Number(symbolIndex)+1));
    requiredTensions[game]=required;
    if(game===EMBEDDED_GAME)window.parent?.postMessage({type:'keynlock-mechanic-tension',game,required},location.origin);
    return required
  }
  function markTensionHint(element,symbolIndex){
    if(!element)return element;
    const tension=Math.max(1,Math.min(5,Number(symbolIndex)+1));
    element.classList.add('tension-hint-symbol');
    element.dataset.tension=String(tension);
    return element
  }
  function tensionReady(game,{statusEl=null,messageEl=null}={}){
    const required=requiredTensions[game];
    if(!required||required===playerTensionSkin)return true;
    if(statusEl)statusEl.innerHTML='<strong>Неверный натяжитель</strong>сопоставь инструмент с символом узора';
    if(messageEl)messageEl.textContent='Замок сопротивляется: выбран другой тип натяжителя.';
    window.parent?.postMessage({type:'keynlock-mechanic-wrong-tension',game,required,selected:playerTensionSkin},location.origin);
    return false
  }
  function open(game,{statusEl=null,statusHtml='<strong>Замок открыт</strong>',messageEl=null,message='',onOpen=null}={}){
    const s=scene(game);if(s?.dataset.lockOpened==='true')return false;
    if(s)s.dataset.lockOpened='true';
    if(statusEl&&statusHtml)statusEl.innerHTML=statusHtml;
    if(messageEl&&message)messageEl.textContent=message;
    onOpen?.();
    window.parent?.postMessage({type:'keynlock-mechanic-open',game,score:scoreValue(game)},location.origin);
    return true
  }
  function resetOpen(game){const s=scene(game);if(s)delete s.dataset.lockOpened}
  function isOpen(game){return scene(game)?.dataset.lockOpened==='true'}
  function initAll(){GameHub.scenes.forEach(s=>{if(!s.querySelector('[data-head-picks]'))return;const el=s.querySelector('[data-head-picks]');if(!el.textContent.trim())el.textContent=String(DEFAULT_PICKS)})}
  return{DEFAULT_PICKS,syncPicks,resetPicks,breakPick,setRequiredTension,markTensionHint,tensionReady,open,resetOpen,isOpen,initAll};
})();
(()=>{
'use strict';
// Portable game module: alpha-protocol
// Alpha Protocol
const apLock=document.getElementById('apLock'),apStatus=document.getElementById('apStatus'),apTimer=document.getElementById('apTimer'),apMsg=document.getElementById('apMsg');
const AP_STEP=.5,AP_MIN_Y=-2,AP_MAX_Y=50,AP_PIXEL_TOL=2.25,AP_TIME=26;
function apQuant(v){return Math.round(v/AP_STEP)*AP_STEP}
function apClamp(v){return Math.max(AP_MIN_Y,Math.min(AP_MAX_Y,apQuant(v)))}
let ap={pins:[],sel:0,time:AP_TIME,last:performance.now(),won:false,failed:false,picks:3,order:[],orderStep:0,calibrated:false};
function apMakePin(){
  return{y:0,groove:14+Math.floor(Math.random()*73),target:0,set:false}
}
function apCountSet(){return ap.pins.filter(p=>p.set).length}
function apLineCenter(){const r=apLock.querySelector('.ap-line').getBoundingClientRect();return (r.top+r.bottom)/2}
function apGrooveCenter(i){const g=apLock.querySelectorAll('.ap-pin')[i]?.querySelector('.ap-groove');if(!g)return NaN;const r=g.getBoundingClientRect();return (r.top+r.bottom)/2}
function apPixelDiff(i){const a=apGrooveCenter(i),b=apLineCenter();return Number.isFinite(a)&&Number.isFinite(b)?Math.abs(a-b):Infinity}
function apPassesIndex(i){
  const pin=apLock.querySelectorAll('.ap-pin')[i],shaft=pin?.querySelector('.ap-shaft'),groove=shaft?.querySelector('.ap-groove'),line=apLock.querySelector('.ap-line');
  if(!pin||!shaft||!groove||!line)return false;
  const lineRect=line.getBoundingClientRect(),beamY=(lineRect.top+lineRect.bottom)/2,shaftRect=shaft.getBoundingClientRect(),grooveRect=groove.getBoundingClientRect();
  if(beamY<shaftRect.top||beamY>shaftRect.bottom)return true;
  return beamY>=grooveRect.top&&beamY<=grooveRect.bottom;
}
function apReadyIndex(i){return apPassesIndex(i)}
function apBeamProgress(){
  const beam=document.getElementById('apBeamFill')?.parentElement;
  const pins=[...apLock.querySelectorAll('.ap-pin')];
  if(!beam||!pins.length)return 0;
  const line=apLock.querySelector('.ap-line');
  const lineRect=line?.getBoundingClientRect();
  const beamRect=beam.getBoundingClientRect();
  const beamY=lineRect?(lineRect.top+lineRect.bottom)/2:(beamRect.top+beamRect.bottom)/2;
  const beamLeft=beamRect.left,beamWidth=beamRect.width||1;
  for(let i=0;i<pins.length;i++){
    const shaft=pins[i].querySelector('.ap-shaft');
    const groove=shaft?.querySelector('.ap-groove');
    if(!shaft||!groove)continue;
    const shaftRect=shaft.getBoundingClientRect();
    if(beamY<shaftRect.top||beamY>shaftRect.bottom)continue;
    const grooveRect=groove.getBoundingClientRect();
    const throughGap=beamY>=grooveRect.top&&beamY<=grooveRect.bottom;
    if(throughGap)continue;
    const stop=Math.max(0,Math.min(beamWidth,shaftRect.left-beamLeft));
    return stop/beamWidth*100;
  }
  return 100;
}
function apCalibratePins(){
  const lineY=apLineCenter(),els=[...apLock.querySelectorAll('.ap-pin')];
  ap.pins.forEach((p,i)=>{
    const pin=els[i],shaft=pin?.querySelector('.ap-shaft');if(!pin||!shaft)return;
    const pr=pin.getBoundingClientRect();
    const h=pr.height;
    // Groove center = pinTop + y%*pinH + groove%*(52%*pinH).
    const raw=((lineY-pr.top)/h*100)-(p.groove*.52);
    p.target=apClamp(raw);
    // Pick a reachable starting point at least 6% away from the solution.
    const candidates=[-16,-12,-9,-6,6,9,12,16].map(v=>apClamp(p.target+v)).filter(v=>v!==p.target);
    p.y=candidates[Math.floor(Math.random()*candidates.length)] ?? apClamp(p.target+6);
  });
}
function apIdealMoves(){return ap.pins.reduce((sum,p)=>sum+Math.round(Math.abs(p.target-p.y)/AP_STEP),0)+ap.pins.length}
function apFinishCalibration(){
  const h=apLock.getBoundingClientRect().height;
  if(h<40)return false;
  apCalibratePins();
  ap.calibrated=true;
  scoreReset('Alpha Protocol',apIdealMoves());
  renderAp();
  return true
}
function apEnsureCalibrated(){
  if(ap.calibrated)return;
  renderAp(false);
  requestAnimationFrame(()=>{if(!apFinishCalibration())requestAnimationFrame(apFinishCalibration)})
}
function apReset(){
  const order=shuffled([0,1,2,3,4]);
  ap={pins:Array.from({length:5},apMakePin),sel:0,time:AP_TIME,last:performance.now(),won:false,failed:false,picks:LockRuntime.DEFAULT_PICKS,order,orderStep:0,calibrated:false};LockRuntime.resetOpen('Alpha Protocol');LockRuntime.resetPicks('Alpha Protocol',ap);
  LockRuntime.setRequiredTension('Alpha Protocol',order[order.length-1]);
  renderAp(false);
  if(activeName()==='Alpha Protocol'&&!apFinishCalibration())apEnsureCalibrated()
}
function apMove(d){
  if(ap.won||ap.failed||ap.time<=0||!ap.calibrated)return;
  const p=ap.pins[ap.sel];
  if(p.set){apMsg.textContent='Этот пин уже зафиксирован — перейди к другому.';return}
  scoreAction('Alpha Protocol');
  p.y=apClamp(p.y+d);
  renderAp();
  apMsg.textContent=apReadyIndex(ap.sel)?'Щель на линии — фиксируй.':'Совмести щель паза с золотой линией.'
}
function apSelect(d){if(ap.won||ap.failed)return;ap.sel=(ap.sel+d+ap.pins.length)%ap.pins.length;renderAp()}
function apSet(){
  if(ap.won||ap.failed||ap.time<=0||!ap.calibrated)return;
  const p=ap.pins[ap.sel];
  if(p.set){apMsg.textContent='Этот пин уже зафиксирован.';return}
  scoreAction('Alpha Protocol');
  const expected=ap.order[ap.orderStep];
  if(ap.sel!==expected){ap.time=Math.max(0,ap.time-1);LockRuntime.breakPick('Alpha Protocol',ap,{messageEl:apMsg,message:'Неверный символ — отмычка сломалась.',onEmpty:()=>{ap.failed=true;apStatus.innerHTML='<strong>Отмычки закончились</strong>перезапусти замок'}});renderAp();return}
  if(apReadyIndex(ap.sel)){
    if(ap.orderStep===ap.order.length-1&&!LockRuntime.tensionReady('Alpha Protocol',{statusEl:apStatus,messageEl:apMsg}))return;
    p.set=true;ap.orderStep++;
    if(ap.orderStep>=ap.order.length){ap.won=true;apMsg.textContent='';LockRuntime.open('Alpha Protocol',{statusEl:apStatus,statusHtml:'<strong>Механизм выставлен</strong>нажми на замок наверху'})}
    else{apMsg.textContent='Верно. Найди следующий символ сам.'}
    renderAp();return
  }
  ap.time=Math.max(0,ap.time-1.25);LockRuntime.breakPick('Alpha Protocol',ap,{messageEl:apMsg,message:'Щель не совпала — отмычка сломалась.',onEmpty:()=>{ap.failed=true;apStatus.innerHTML='<strong>Отмычки закончились</strong>перезапусти замок'}});renderAp()
}
function renderApSequence(){const box=document.getElementById('apSequence');if(!box)return;box.innerHTML='';ap.order.forEach((pinIndex,step)=>{const d=document.createElement('div');d.className='ap-seq-item'+(step<ap.orderStep?' done':step===ap.orderStep&&!ap.won?' current':'');if(step===ap.order.length-1)LockRuntime.markTensionHint(d,pinIndex);d.innerHTML=LOCK_SYMBOLS[pinIndex];box.appendChild(d)})}
function apSymbolTop(p){return p.groove>50?18:82}
function renderAp(markReady=true){LockRuntime.syncPicks('Alpha Protocol',ap.picks);
  apLock.querySelectorAll('.ap-pin').forEach(n=>n.remove());
  ap.pins.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='ap-pin'+(i===ap.sel?' active':'')+(p.set?' set':'');
    d.innerHTML=`<div class="ap-shaft" style="--y:${p.y}%;--groove:${p.groove}%"><span class="ap-symbol" style="--symbol-top:${apSymbolTop(p)}%">${LOCK_SYMBOLS[i]}</span><span class="ap-groove"></span></div>`;
    d.onclick=()=>{ap.sel=i;renderAp()};apLock.appendChild(d)
  });
  if(markReady){
    [...apLock.querySelectorAll('.ap-pin')].forEach((d,i)=>d.classList.toggle('ready',!ap.pins[i].set&&apReadyIndex(i)));
  }
  const beam=document.getElementById('apBeamFill');
  if(beam)beam.style.width=(markReady?apBeamProgress():0)+'%';
  renderApSequence();
  apTimer.style.width=Math.max(0,ap.time/AP_TIME*100)+'%';
  if(!ap.won&&!ap.failed){const n=apCountSet();apStatus.innerHTML=`<strong>${n} / 5</strong>Выставляй пины в порядке символов под замком`}
}
function apLoop(now){const dt=Math.min(.05,(now-ap.last)/1000);ap.last=now;if(activeName()==='Alpha Protocol'&&ap.calibrated&&!ap.won&&!ap.failed&&ap.time>0){ap.time=Math.max(0,ap.time-dt);apTimer.style.width=Math.max(0,ap.time/AP_TIME*100)+'%';if(ap.time<=0){ap.time=0;ap.failed=true;apStatus.innerHTML='<strong>Время вышло</strong>сработала тревога';apMsg.textContent='Новая попытка потребуется.';window.parent?.postMessage({type:'keynlock-mechanic-loss',game:'Alpha Protocol',reason:'time'},location.origin)}}}

GameHub.register('Alpha Protocol',{
  reset:apReset,
  tick:apLoop,
  enter:apEnsureCalibrated,
  mistake:()=>{
    if(!ap.won||ap.orderStep<ap.order.length)return;
    ap.won=false;
    ap.orderStep=ap.order.length-1;
    ap.pins[ap.order[ap.orderStep]].set=false;
    LockRuntime.breakPick('Alpha Protocol',ap,{messageEl:apMsg,message:'Неверный натяжитель — отмычка сломалась.',onEmpty:()=>{ap.failed=true;apStatus.innerHTML='<strong>Отмычки закончились</strong>замок не открыт'}});
    renderAp();
  },
  keydown:e=>{const d=directionFromCode(e.code);if(e.code==='KeyR'){apReset();return true}if(e.code==='Space'){apSet();return true}if(d==='left'){apSelect(-1);return true}if(d==='right'){apSelect(1);return true}if(d==='up'){apMove(-AP_STEP);return true}if(d==='down'){apMove(AP_STEP);return true}return false}
});

})();
GameHub.boot();
const embeddedGame=EMBEDDED_GAME;
if(embeddedGame){
  document.documentElement.classList.add('embedded');
  document.body.tabIndex=-1;
  const embeddedIndex=GameHub.scenes.findIndex(scene=>scene.dataset.name===embeddedGame);
  if(embeddedIndex>=0) GameHub.show(embeddedIndex);
  const activeScene=GameHub.scene(embeddedGame);
  if(activeScene){
    const activeStatus=activeScene.querySelector(':scope > .scene-head .status');
    const lossObserver=new MutationObserver(()=>{
      emitEmbeddedState(embeddedGame);
      if(/отмычки закончились/i.test(activeStatus?.textContent||'')){
        window.parent?.postMessage({type:'keynlock-mechanic-loss',game:embeddedGame},location.origin);
      }
    });
    if(activeStatus)lossObserver.observe(activeStatus,{subtree:true,childList:true,characterData:true});
    emitEmbeddedState(embeddedGame);
    requestAnimationFrame(()=>{window.focus();document.body.focus({preventScroll:true})});
  }
}
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='keynlock-player-tools')return;
  playerTensionSkin=Math.max(1,Math.min(5,Math.round(Number(event.data.tensionSkin)||1)));
});
</script>
