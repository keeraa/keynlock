<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прототипы взлома</title>

<style>
:root {
  --bg:#0d100d;
  --panel:#151913;
  --panel2:#1e231b;
  --line:#343a2f;
  --line2:#555d48;
  --ink:#eee4ca;
  --muted:#9c9681;
  --gold:#d8b871;
  --good:#7bbf78;
  --bad:#b9655c;
  --blue:#5ca4d9;
  --white:#cfd3cc;
}
* {
  box-sizing:border-box
}
html,body {
  margin:0;
  min-height:100%;
  background:radial-gradient(circle at 50% -20%,#2b2e23 0,#151812 44%,#0b0d0a 100%);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif
}
button {
  font:inherit
}
.app {
  width:min(760px,100%);
  margin:auto;
  padding:18px
}
.tabs {
  display:flex;
  gap:10px;
  margin-bottom:12px
}
.tab {
  flex:1;
  border:1px solid var(--line);
  background:#151913;
  color:#aaa38e;
  padding:12px 14px;
  border-radius:14px;
  cursor:pointer
}
.tab.has-check {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px
}
.tab-check {
  color:#91a870;
  font-weight:800;
  font-size:14px;
  line-height:1
}
.tab.active {
  background:#2a3024;
  color:white;
  border-color:#68705a
}
.stage {
  border:1px solid #30362b;
  border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(0,0,0,.08)),#121510;
  overflow:hidden
}
.scene {
  display:none;
  padding:24px;
  min-height:700px
}
.scene.active {
  display:block
}
.scene-head {
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-bottom:12px
}
.scene-head h2 {
  font:500 30px/1.05 Georgia,serif;
  margin:0 0 8px
}.status {
  text-align:right;
  min-width:170px;
  color:#aaa38e;
  font-size:12px
}
.status strong {
  display:block;
  color:#f4ead1;
  font-size:15px;
  margin-bottom:3px
}
.status[data-score]::after {
  content:attr(data-score);
  display:block;
  margin-top:8px;
  padding-top:7px;
  border-top:1px solid rgba(255,255,255,.08);
  color:#d8b871;
  font:600 11px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:nowrap
}
.lab {
  min-height:560px;
  border:1px solid #292f25;
  border-radius:20px;
  padding:22px;
  background:rgba(255,255,255,.012);
  display:flex;
  align-items:center;
  justify-content:center
}
.btn {
  border:1px solid #4b5241;
  background:#262b21;
  color:var(--ink);
  padding:11px 15px;
  border-radius:12px;
  cursor:pointer
}
.btn:hover {
  border-color:#747c63
}
.btn.active {
  border-color:var(--gold);
  background:#342d20
}.meters {
  width:100%;
  display:grid;
  gap:10px
}
.meter-head {
  display:flex;
  justify-content:space-between;
  color:#aaa38e;
  font-size:11px;
  margin-bottom:5px
}
.bar {
  height:9px;
  border-radius:999px;
  background:#0e110d;
  border:1px solid #31372c;
  overflow:hidden
}
.bar>span {
  display:block;
  height:100%;
  width:0;
  background:#899d6d;
  transition:width .08s linear
}
/* Museum expansion */ .museum-wrap {
  width:min(620px,100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px
}
.museum-panel {
  width:100%;
  border:1px solid #3d4538;
  border-radius:18px;
  background:#111610;
  padding:18px;
  box-shadow:inset 0 0 28px rgba(0,0,0,.3)
}
.museum-actions {
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap
}
.museum-msg {
  min-height:20px;
  text-align:center;
  color:#bbb49d;
  font-size:12px
}
/* v5 — unified keyboard focus */ .kb-focus {
  outline:2px solid var(--gold)!important;
  outline-offset:2px!important;
  box-shadow:0 0 0 3px rgba(214,179,111,.12)!important
}
/* v8 clarity */ .scene-badge {
  display:inline-block;
  vertical-align:.18em;
  margin-left:7px;
  padding:3px 7px;
  border:1px solid #806c4d;
  border-radius:999px;
  color:#d8bd78;
  font:600 9px/1 Inter,system-ui,sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase
}
/* Mobile controls */ .sf-lock,.me1-arena {
  touch-action:none
}
.btn,.tab,.tumbler-slot,.pick-type {
  -webkit-tap-highlight-color:transparent
}
@media(max-width:650px) {
  .app {
    padding-left:max(12px,env(safe-area-inset-left));
    padding-right:max(12px,env(safe-area-inset-right));
    padding-bottom:max(16px,env(safe-area-inset-bottom))
  }
  .scene {
    padding:14px
  }
  .lab {
    padding:12px
  }
  .scene-head {
    margin-bottom:14px
  }
  .btn,.tab {
    min-height:46px;
    touch-action:manipulation
  }
  .museum-actions,.bio-actions,.r2-actions {
    width:100%
  }
  .museum-actions .btn,.bio-actions .btn,.r2-actions .btn {
    flex:1 1 112px
  }
  .th12-profiles .btn {
    min-height:72px;
    touch-action:none
  }
  .tumbler-slot {
    touch-action:manipulation
  }
  .tds-lock,.kcd-lock,.sf-lock {
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none
  }
}
@media(max-width:650px) {
  .tabs {
    overflow-x:auto;
    gap:6px
  }
  .tab {
    flex:0 0 auto;
    min-width:112px;
    padding:10px 7px;
    font-size:12px
  }
  .scene-head {
    display:block
  }
  .status {
    text-align:left;
    margin-top:10px
  }
}
@keyframes shake {
  25% {
    translate:-1px .5px
  }
  75% {
    translate:1px -.5px
  }
}
/* Shared controls and symbols */
.lockpick-prototype .restart-icon-btn{width:44px;min-width:44px;height:44px;padding:0!important;border-radius:12px;display:inline-grid;place-items:center;line-height:1}
.lockpick-prototype .restart-icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Shared title lockpick counter */
.lockpick-prototype .scene-title-row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap
}
.lockpick-prototype .scene-title-row h2{
  margin:0
}
.lockpick-prototype .head-picks{
  flex:0 0 auto;
  border:1px solid #353c30;
  background:#151913;
  border-radius:10px;
  padding:7px 10px;
  color:#99927e;
  font-size:11px;
  white-space:nowrap
}
.lockpick-prototype .head-picks strong{
  color:#f0e6cc;
  font-size:14px;
  margin-left:4px
}
@media(max-width:650px){
  .lockpick-prototype .scene-title-row{
    gap:8px
  }
}

html.embedded{--bg:#17100a;--panel:#261a10;--panel2:#352516;--line:#71512b;--line2:#a6783d;--ink:#eee0c0;--muted:#b7a17c;--gold:#d8b871;--good:#c69b52;--blue:#b98443}
html.embedded,html.embedded body{width:100%;height:100%;overflow:hidden;background:transparent;color:#ead7ad}
html.embedded .app{width:100%;height:100%;padding:0}
html.embedded .tabs{display:none}
html.embedded .stage{width:100%;height:100%;border:0;border-radius:0;background:transparent;overflow:auto;scrollbar-width:none}
html.embedded *,html.embedded *::before,html.embedded *::after{scrollbar-width:none}
html.embedded *::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
html.embedded .scene{min-height:100%;padding:76px 22px 150px}
html.embedded .scene-head{display:none}
html.embedded .head-picks,html.embedded .status{color:#c5ad80}
html.embedded .head-picks{border-color:rgba(190,145,71,.5);background:rgba(28,20,13,.78)}
html.embedded .lab{max-width:1040px;min-height:calc(100vh - 226px);margin:auto;border:0;background:transparent;box-shadow:none}
html.embedded .btn{border-color:rgba(187,141,70,.7);background:linear-gradient(#4a341d,#24180f);color:#efd095}
html.embedded .status strong{color:#f0d49d}
html.embedded .scene[data-name="Kingdom Come"] .kcd-lock{border-color:#8b6638;background:radial-gradient(circle at 50% 50%,transparent 0 11%,rgba(0,0,0,.28) 11.5% 13%,transparent 13.5%),repeating-conic-gradient(from 3deg,rgba(224,181,105,.055) 0 2deg,transparent 2deg 15deg),radial-gradient(circle at 46% 42%,#594125 0 16%,#342417 17% 48%,#21160f 49% 72%,#120d09 73% 100%);box-shadow:inset 0 0 0 10px #24170e,inset 0 0 0 12px #8a6536,inset 0 0 50px rgba(0,0,0,.65),0 18px 40px rgba(0,0,0,.32)}
html.embedded .scene[data-name="Kingdom Come"] .kcd-rotor{border-color:#8c693b;background:repeating-conic-gradient(from 0deg,#4b351f 0 19deg,#2d1f14 19deg 39deg)}
html.embedded .scene[data-name="Risen 2"]{padding-top:340px}
html.embedded .scene[data-name="Risen 2"] .lab{align-items:flex-start}
html.embedded .scene[data-name="Alpha Protocol"]{padding-top:340px}
html.embedded .scene[data-name="Alpha Protocol"] .lab{align-items:flex-start}
@media(max-width:760px){html.embedded .scene{padding:58px 10px 118px}html.embedded .lab{min-height:calc(100vh - 176px);padding:10px}}
</style>
</head>
<body>
<div class="app lockpick-prototype">
  <div class="tabs" id="tabs"></div>
  <main class="stage">
  </main>
</div>

<script>
// KEYNLOCK mechanics prototype core.
// Games register a small portable adapter: reset / enter / leave / keydown / keyup / tick.
const GameHub=(()=>{
  const root=document.querySelector('.lockpick-prototype');
  const scenes=[...root.querySelectorAll('.scene')];
  const tabs=root.querySelector('#tabs');
  const games=new Map();
  const restartIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"></path><path d="M18.5 15a7 7 0 1 1 .5-7"></path></svg>';
  let booted=false,rafId=0;

  function activeName(){return root.querySelector('.scene.active')?.dataset.name||''}
  function scene(name){return scenes.find(s=>s.dataset.name===name)||null}
  function register(name,api){games.set(name,api||{})}
  function get(name=activeName()){return games.get(name)||null}
  function show(i,initial=false){
    const next=scenes[i];
    if(!next)return;
    const prevName=activeName();
    if(!initial)games.get(prevName)?.leave?.();
    scenes.forEach((s,j)=>s.classList.toggle('active',i===j));
    [...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));
    games.get(next.dataset.name)?.enter?.();
  }
  function resetAll(){for(const s of scenes)games.get(s.dataset.name)?.reset?.()}
  function frame(now){
    games.get(activeName())?.tick?.(now);
    rafId=requestAnimationFrame(frame);
  }
  function startLoop(){if(!rafId)rafId=requestAnimationFrame(frame)}
  function boot(){
    if(booted)return; booted=true;
    root.querySelectorAll('button[id$="Reset"]').forEach(b=>{
      const old=b.textContent.trim();
      b.classList.add('restart-icon-btn');
      b.title=old||'Перезапустить';
      b.setAttribute('aria-label',old||'Перезапустить');
      b.innerHTML=restartIcon;
    });
    tabs.innerHTML='';
    scenes.forEach((s,i)=>{
      const b=document.createElement('button');
      b.className='tab'+(s.classList.contains('active')?' active':'')+(s.dataset.tabCheck==='true'?' has-check':'');
      const label=s.dataset.tabLabel||s.dataset.name;
      b.innerHTML=s.dataset.tabCheck==='true'?`<span class="tab-check">✓</span><span>${label}</span>`:label;
      b.onclick=()=>show(i);
      tabs.appendChild(b);
    });
    resetAll();
    LockRuntime.initAll();
    const initial=Math.max(0,scenes.findIndex(s=>s.classList.contains('active')));
    show(initial,true);
    startLoop();
  }
  document.addEventListener('keydown',e=>{if(get()?.keydown?.(e)===true)e.preventDefault()});
  document.addEventListener('keyup',e=>{if(get()?.keyup?.(e)===true)e.preventDefault()});
  return{root,scenes,register,get,scene,show,boot,resetAll,activeName};
})();

const scenes=GameHub.scenes;
function activeName(){return GameHub.activeName()}
function directionFromCode(code){
  if(code==='ArrowLeft'||code==='KeyA')return'left';
  if(code==='ArrowRight'||code==='KeyD')return'right';
  if(code==='ArrowUp'||code==='KeyW')return'up';
  if(code==='ArrowDown'||code==='KeyS')return'down';
  return null;
}
function angleDiff(a,b){return Math.abs(((a-b+540)%360)-180)}
function shuffled(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
const LOCK_SYMBOLS=[
  '<svg viewBox="0 0 48 48"><path d="M24 5V43"/></svg>',
  '<svg viewBox="0 0 48 48"><path d="M8 8H27Q38 8 38 20V43"/></svg>',
  '<svg viewBox="0 0 48 48"><path d="M25 5C14 11 35 17 24 24C14 31 35 37 24 43"/></svg>',
  '<svg viewBox="0 0 48 48"><path d="M14 43V23Q14 7 28 7Q41 7 41 22V25"/></svg>',
  '<svg viewBox="0 0 48 48"><path d="M39 6L14 24L39 43"/></svg>'

];

// Shared move-based scoring. A game opts in by calling scoreReset/scoreAction.
const EMBEDDED_PARAMS=new URLSearchParams(location.search);
const EMBEDDED_GAME=EMBEDDED_PARAMS.get('game')||'';
const EMBEDDED_PICK_VALUE=Number(EMBEDDED_PARAMS.get('picks'));
const EMBEDDED_TENSION_VALUE=Number(EMBEDDED_PARAMS.get('tension'));
const PLAYER_PICK_COUNT=Math.max(0,Math.min(99,Math.round(Number.isFinite(EMBEDDED_PICK_VALUE)?EMBEDDED_PICK_VALUE:3)));
let playerTensionSkin=Math.max(1,Math.min(5,Math.round(Number.isFinite(EMBEDDED_TENSION_VALUE)?EMBEDDED_TENSION_VALUE:1)));
const SCORE_BASE=1000,SCORE_STEP=50,scoreState={};
function scoreScene(game){return GameHub.scene(game)}
function scoreReset(game,ideal){ideal=Math.max(1,Math.round(ideal||1));scoreState[game]={moves:0,ideal};scoreRender(game)}
function scoreAction(game,n=1){const s=scoreState[game];if(!s)return;s.moves+=n;scoreRender(game)}
function scoreValue(game){const s=scoreState[game];if(!s)return SCORE_BASE;return Math.max(0,SCORE_BASE-Math.max(0,s.moves-s.ideal)*SCORE_STEP)}
function embeddedGoal(game){const status=scoreScene(game)?.querySelector(':scope > .scene-head .status');if(!status)return 'Выполнить взлом';return [...status.childNodes].filter(node=>!(node.nodeType===1&&node.matches?.('strong'))).map(node=>node.textContent||'').join(' ').replace(/\s+/g,' ').trim()||status.querySelector('strong')?.textContent||'Выполнить взлом'}
function emitEmbeddedState(game){if(game!==EMBEDDED_GAME)return;const s=scoreState[game];window.parent?.postMessage({type:'keynlock-mechanic-state',game,goal:embeddedGoal(game),moves:s?.moves,ideal:s?.ideal,reward:scoreValue(game)},location.origin)}
function scoreRender(game){const s=scoreState[game],scene=scoreScene(game);if(!s||!scene)return;const status=scene.querySelector('.status');if(status)status.dataset.score=`Очки ${scoreValue(game)} · ходы ${s.moves} · норма ${s.ideal}`;emitEmbeddedState(game)}

// Shared runtime used by every lock module. Keep game modules portable: they only
// own their puzzle state; lockpick stock and final open transition live here.
const LockRuntime=(()=>{
  const DEFAULT_PICKS=PLAYER_PICK_COUNT;
  const lastPicks={};
  const requiredTensions={};
  function scene(game){return GameHub.scene(game)}
  function counter(game){return scene(game)?.querySelector('[data-head-picks]')||null}
  function syncPicks(game,picks=DEFAULT_PICKS){
    const value=Math.max(0,Math.round(Number.isFinite(+picks)?+picks:DEFAULT_PICKS));
    const previous=lastPicks[game];lastPicks[game]=value;
    const el=counter(game);if(el)el.textContent=String(value);
    if(game===EMBEDDED_GAME&&Number.isFinite(previous)&&value<previous)window.parent?.postMessage({type:'keynlock-mechanic-picks',game,remaining:value,spent:previous-value},location.origin);
    return value
  }
  function resetPicks(game,state,count=DEFAULT_PICKS){if(state)state.picks=count;return syncPicks(game,count)}
  function breakPick(game,state,{count=1,messageEl=null,message='',emptyMessage='Отмычки закончились.',onEmpty=null}={}){
    if(!state)return 0;
    state.picks=Math.max(0,(Number.isFinite(+state.picks)?+state.picks:DEFAULT_PICKS)-count);
    syncPicks(game,state.picks);
    if(state.picks<=0){if(messageEl)messageEl.textContent=emptyMessage;onEmpty?.();window.parent?.postMessage({type:'keynlock-mechanic-loss',game},location.origin)}
    else if(messageEl&&message)messageEl.textContent=message;
    return state.picks
  }
  function setRequiredTension(game,symbolIndex){
    const required=Math.max(1,Math.min(5,Number(symbolIndex)+1));
    requiredTensions[game]=required;
    if(game===EMBEDDED_GAME)window.parent?.postMessage({type:'keynlock-mechanic-tension',game,required},location.origin);
    return required
  }
  function markTensionHint(element,symbolIndex){
    if(!element)return element;
    const tension=Math.max(1,Math.min(5,Number(symbolIndex)+1));
    element.classList.add('tension-hint-symbol');
    element.dataset.tension=String(tension);
    return element
  }
  function tensionReady(game,{statusEl=null,messageEl=null}={}){
    const required=requiredTensions[game];
    if(!required||required===playerTensionSkin)return true;
    if(statusEl)statusEl.innerHTML='<strong>Неверный натяжитель</strong>сопоставь инструмент с символом узора';
    if(messageEl)messageEl.textContent='Замок сопротивляется: выбран другой тип натяжителя.';
    window.parent?.postMessage({type:'keynlock-mechanic-wrong-tension',game,required,selected:playerTensionSkin},location.origin);
    return false
  }
  function open(game,{statusEl=null,statusHtml='<strong>Замок открыт</strong>',messageEl=null,message='',onOpen=null}={}){
    const s=scene(game);if(s?.dataset.lockOpened==='true')return false;
    if(s)s.dataset.lockOpened='true';
    if(statusEl&&statusHtml)statusEl.innerHTML=statusHtml;
    if(messageEl&&message)messageEl.textContent=message;
    onOpen?.();
    window.parent?.postMessage({type:'keynlock-mechanic-open',game,score:scoreValue(game)},location.origin);
    return true
  }
  function resetOpen(game){const s=scene(game);if(s)delete s.dataset.lockOpened}
  function isOpen(game){return scene(game)?.dataset.lockOpened==='true'}
  function initAll(){GameHub.scenes.forEach(s=>{if(!s.querySelector('[data-head-picks]'))return;const el=s.querySelector('[data-head-picks]');if(!el.textContent.trim())el.textContent=String(DEFAULT_PICKS)})}
  return{DEFAULT_PICKS,syncPicks,resetPicks,breakPick,setRequiredTension,markTensionHint,tensionReady,open,resetOpen,isOpen,initAll};
})();
GameHub.boot();
const embeddedGame=EMBEDDED_GAME;
if(embeddedGame){
  document.documentElement.classList.add('embedded');
  document.body.tabIndex=-1;
  const embeddedIndex=GameHub.scenes.findIndex(scene=>scene.dataset.name===embeddedGame);
  if(embeddedIndex>=0) GameHub.show(embeddedIndex);
  const activeScene=GameHub.scene(embeddedGame);
  if(activeScene){
    const activeStatus=activeScene.querySelector(':scope > .scene-head .status');
    const lossObserver=new MutationObserver(()=>{
      emitEmbeddedState(embeddedGame);
      if(/отмычки закончились/i.test(activeStatus?.textContent||'')){
        window.parent?.postMessage({type:'keynlock-mechanic-loss',game:embeddedGame},location.origin);
      }
    });
    if(activeStatus)lossObserver.observe(activeStatus,{subtree:true,childList:true,characterData:true});
    emitEmbeddedState(embeddedGame);
    requestAnimationFrame(()=>{window.focus();document.body.focus({preventScroll:true})});
  }
}
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='keynlock-player-tools')return;
  playerTensionSkin=Math.max(1,Math.min(5,Math.round(Number(event.data.tensionSkin)||1)));
});
</script>
</body>
</html>
